plugins {
    id 'net.fabricmc.fabric-loom'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        zomboidcraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Simple Voice Chat's plugin API, for radios that carry players' voices (optional at run time)
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_version': project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// every thread's blocks together pass the plain zip format's 65535 entries: the jar is written as zip64
tasks.withType(Zip).configureEach {
    zip64 = true
}

// In-game UI test (./gradlew runClientGameTest -Puitest): opens the kit screen in a real client and clicks it.
if (project.hasProperty('uitest')) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'zomboidcraft-uitest'
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }
}
