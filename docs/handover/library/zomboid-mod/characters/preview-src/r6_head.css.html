<title>Harvestman</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one dark kit-screen column; the stage on top, the controls as key caps under it, then the two forms side by side. */
:root {
  --bg: #0b0c0e;
  --glass: rgba(12, 13, 15, .96);
  --edge: rgba(232, 228, 218, .18);
  --edge-strong: rgba(232, 228, 218, .34);
  --text: #e8e4da;
  --bright: #f2efe8;
  --dim: rgba(232, 228, 218, .68);
  --faint: rgba(232, 228, 218, .30);
  --bad: #d0675e;
  --warn: #d9a33a;
  --gold: #e0c25e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.eyebrow { font-family: var(--display); font-weight: 600; letter-spacing: .22em; text-transform: uppercase; font-size: 12px; color: var(--dim); }
h1 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: clamp(34px, 6vw, 52px); line-height: 1; margin: 4px 0 8px; color: var(--bright); text-wrap: balance; }
.lead { margin: 0; max-width: 64ch; color: var(--dim); }
.stage { position: relative; border: 1px solid var(--edge); background: #050506; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; overflow: hidden; touch-action: none; cursor: grab; }
.stage:active { cursor: grabbing; }
.stage canvas { display: block; width: 100%; height: 100%; }
.tag { position: absolute; font-family: var(--display); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; padding: 3px 8px; background: rgba(5, 5, 6, .72); border: 1px solid var(--edge); color: var(--text); pointer-events: none; white-space: nowrap; }
.tag.left { left: 10px; top: 10px; }
.tag.right { right: 10px; top: 10px; }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--faint); pointer-events: none; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--dim); }
.controls { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
.group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.group > span { font-family: var(--display); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: var(--faint); min-width: 52px; }
.seg { display: flex; border: 1px solid var(--edge); }
.seg button { font: 600 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); background: transparent; border: 0; padding: 9px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--edge); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.seg button:focus-visible, .toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.toggle { font: 600 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); background: transparent; border: 1px solid var(--edge); padding: 9px 12px; cursor: pointer; }
.toggle[aria-pressed="true"] { border-color: var(--edge-strong); color: var(--bright); }
.section { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; color: var(--dim); margin-top: 6px; }
.section::after { content: ""; flex: 1; height: 1px; background: var(--edge); }
.forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--glass); border: 1px solid var(--edge); display: grid; min-width: 0; }
.card header { padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--edge); }
.card h2 { margin: 0; font-family: var(--display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 20px; color: var(--bright); }
.card .band { font-family: var(--display); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; font-size: 11px; padding: 2px 7px; }
.band.hunt { background: #6e2626; color: #f2efe8; }
.band.feed { background: #b08d3e; color: #1d1b16; }
.card .body { padding: 12px 14px 14px; display: grid; gap: 10px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 24px; color: var(--bright); letter-spacing: .04em; line-height: 1.1; }
.stat small { font-family: var(--display); letter-spacing: .16em; text-transform: uppercase; font-size: 11px; color: var(--faint); }
.card ul { margin: 0; padding-left: 18px; color: var(--dim); display: grid; gap: 4px; }
.card li::marker { color: var(--faint); }
.note { font-size: 13px; color: var(--faint); margin: 0; max-width: 72ch; }
@media (max-width: 640px) {
  .stage { aspect-ratio: 1 / 1; }
  .group > span { min-width: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .seg button { transition: none; } }
.mind { border: 1px solid var(--edge); border-top: 0; background: var(--glass); padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 220px); gap: 10px 20px; align-items: start; }
.mind[hidden], .group[hidden] { display: none; }
.mind .now small { display: block; font-family: var(--display); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: var(--faint); }
.mind .now b { display: block; font-family: var(--display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 18px; color: var(--bright); margin: 2px 0 2px; }
.mind .now p { margin: 0; color: var(--dim); font-size: 14px; }
.needs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 10px; align-items: center; font-size: 12px; color: var(--dim); }
.needs .bar { height: 6px; background: rgba(232, 228, 218, .1); }
.needs .bar i { display: block; height: 100%; width: 0; background: var(--dim); transition: width .3s; }
.needs .bar i[data-need="hunger"] { background: var(--bad); }
.needs .bar i[data-need="wary"] { background: var(--warn); }
@media (max-width: 560px) { .mind { grid-template-columns: minmax(0, 1fr); } }
</style>
