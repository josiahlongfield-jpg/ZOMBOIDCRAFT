<!doctype html><html><body style="margin:0;background:#8a96a0"><canvas id=c></canvas><script>
const q=new URLSearchParams(location.search);
const W=+q.get('w')||1600,H=+q.get('h')||900;const cv=document.getElementById('c');cv.width=W;cv.height=H;
const gl=cv.getContext('webgl2',{antialias:!q.get('hgt'),preserveDrawingBuffer:true});
function mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}
function persp(f,a,n,fa){const t=1/Math.tan(f/2);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]);}
function look(e,c,u){let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]];let l=Math.hypot(...z);z=z.map(v=>v/l);let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]];l=Math.hypot(...x);x=x.map(v=>v/l);const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]),-(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]),-(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]);}
const vs=`#version 300 es
in vec3 p;in float k;uniform mat4 VP;out vec3 wp;flat out int kc;void main(){wp=p;kc=int(k+0.5);gl_Position=VP*vec4(p,1);}`;
const fs=`#version 300 es
precision highp float;in vec3 wp;flat in int kc;uniform vec3 eye;uniform float fogd,snow,nat,hgt;out vec4 o;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){if(hgt>2.5){o=kc==2?vec4(1):vec4(0,0,0,1);return;}if(hgt>1.5){if(kc!=0)discard;o=vec4(1);return;}if(hgt>0.5){if(kc==2)discard;float v=clamp(floor((wp.y+2000.)*100.),1.,16777215.);o=vec4(mod(v,256.)/255.,mod(floor(v/256.),256.)/255.,floor(v/65536.)/255.,1);return;}
vec3 n=normalize(cross(dFdx(wp),dFdy(wp)));if(dot(n,eye-wp)<0.)n=-n;if(kc==2||kc==5)n=vec3(0,1,0);
float ny=n.y;bool made=abs(ny)>0.9995||abs(ny)<0.0015||abs(abs(n.x)-1.)<0.0005||abs(abs(n.z)-1.)<0.0005;
float k=vn(wp.xz*0.05)*0.6+vn(wp.xz*0.4)*0.4;
vec3 grass=mix(vec3(0.26,0.31,0.17),vec3(0.36,0.37,0.22),k);
vec3 dirt=mix(vec3(0.38,0.33,0.25),vec3(0.46,0.41,0.31),k);
vec3 rock=mix(vec3(0.40,0.39,0.37),vec3(0.52,0.50,0.47),vn(wp.xz*0.2+wp.y*0.3));
float sn=snow;if(kc==11||kc==3)sn=1.;if(kc==12||kc==9)sn=2.;
vec3 dry=mix(vec3(0.46,0.44,0.27),vec3(0.55,0.50,0.33),k);vec3 tun=mix(vec3(0.47,0.49,0.43),vec3(0.56,0.57,0.52),k);
if(kc==8)grass=dry;if(kc==10)grass=tun;
vec3 c=ny>0.82?grass:(ny>0.6?mix(rock,dirt,(ny-0.6)/0.22):rock);
if(sn>0.5&&sn<1.5)c=ny>0.6?mix(vec3(0.80,0.83,0.86),vec3(0.92,0.94,0.96),k):mix(rock,vec3(0.85,0.87,0.9),0.25);
if(sn>1.5)c=ny>0.6?mix(vec3(0.62,0.52,0.38),vec3(0.70,0.60,0.44),k):mix(vec3(0.55,0.44,0.34),vec3(0.62,0.50,0.38),k);
if((kc==0||kc==11||kc==12)&&made&&nat<0.5)c=ny>0.9?vec3(0.55,0.56,0.57):vec3(0.48,0.50,0.53);
if(kc==2)c=mix(vec3(0.16,0.24,0.28),vec3(0.20,0.29,0.33),k);if(kc==4)c=mix(rock,vec3(0.55,0.53,0.5),0.3*k);if(kc==5)c=vec3(0.22,0.2,0.2);if(kc==6)c=vec3(0.55,0.57,0.6);
vec3 L=normalize(vec3(-0.45,0.75,0.5));float d=max(dot(n,L),0.);
vec3 col=c*(0.42+0.32*(0.5+0.5*ny)+0.75*d);
float f=1.-exp(-length(eye-wp)/fogd);col=mix(col,vec3(0.56,0.61,0.66),clamp(f,0.,0.85));
o=vec4(pow(col,vec3(1./1.15)),1);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
(async()=>{try{
const buf=await (await fetch(q.get('m')+'.bin')).arrayBuffer();const hd=new Uint32Array(buf,0,3);
const V=new Float32Array(buf,12,hd[0]*3),T=new Uint32Array(buf,12+hd[0]*12,hd[1]*3);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,V,gl.STATIC_DRAW);
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,T,gl.STATIC_DRAW);
const a=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);
const kb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,kb);gl.bufferData(gl.ARRAY_BUFFER,new Uint8Array(buf,12+hd[0]*12+hd[1]*12,hd[0]),gl.STATIC_DRAW);const ka=gl.getAttribLocation(pr,'k');gl.enableVertexAttribArray(ka);gl.vertexAttribPointer(ka,1,gl.UNSIGNED_BYTE,false,0,0);
const c=q.get('c').split(',').map(Number),yaw=(+q.get('yaw')||35)*Math.PI/180,pit=(+q.get('pitch')||40)*Math.PI/180,r=+q.get('r')||1500;
const eye=[c[0]+r*Math.cos(pit)*Math.sin(yaw),c[1]+r*Math.sin(pit),c[2]+r*Math.cos(pit)*Math.cos(yaw)];
const O=+q.get('o')||0;const eyeO=[c[0],c[1]+20000,c[2]];
const VP=O?mul(new Float32Array([1/O,0,0,0,0,1/O,0,0,0,0,-2/40000,0,0,0,-1,1]),look(eyeO,c,[0,0,-1])):mul(persp((+q.get('fov')||40)*Math.PI/180,W/H,Math.max(1,r/200),r*6),look(eye,c,[0,1,0]));
gl.uniformMatrix4fv(gl.getUniformLocation(pr,'VP'),false,VP);gl.uniform3fv(gl.getUniformLocation(pr,'eye'),O?eyeO:eye);
gl.uniform1f(gl.getUniformLocation(pr,'fogd'),r*(+q.get('fog')||3));gl.uniform1f(gl.getUniformLocation(pr,'snow'),+q.get('snow')||0);gl.uniform1f(gl.getUniformLocation(pr,'hgt'),+q.get('hgt')||0);
gl.viewport(0,0,W,H);q.get('hgt')?gl.clearColor(0,0,0,1):gl.clearColor(0.56,0.61,0.66,1);gl.enable(gl.DEPTH_TEST);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const un=gl.getUniformLocation(pr,'nat');gl.uniform1f(un,0);gl.drawElements(gl.TRIANGLES,(hd[1]-hd[2])*3,gl.UNSIGNED_INT,0);gl.uniform1f(un,1);if(hd[2])gl.drawElements(gl.TRIANGLES,hd[2]*3,gl.UNSIGNED_INT,(hd[1]-hd[2])*12);gl.finish();document.title='done';}catch(e){document.title='err '+e;}})();
</script></body></html>
