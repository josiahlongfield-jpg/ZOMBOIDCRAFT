uniform float time,rez,minY,maxY,glow; varying vec2 vUv; varying vec3 vN,vV,vW;
uniform sampler2D ramp,scan,noise;
float rezMask(out float edge){

const FCOM=`
precision highp float;
uniform float time,rez,minY,maxY,glow; varying vec2 vUv,vUv2; varying vec3 vN,vV,vW; varying vec4 vTg; uniform float hueK,satK,faceSmooth,gradK;
uniform sampler2D ramp,noise; uniform vec3 L1,L2,L3,Lk; uniform float wrinkleK,flowSpeed,expo,neckK;
float sat(float x){return clamp(x,0.0,1.0);}
float rezMask(out float edge){ float h=(vW.y-minY)/(maxY-minY); float n=texture2D(noise,vW.xz*3.0+vec2(0.0,time*0.2)).r*0.08;

mat3 tbn(vec3 N){ ${P.has('dtbn')?'':'vec3 sTu=normalize(vTg.xyz-N*dot(N,vTg.xyz)); vec3 sTv=cross(N,sTu)*vTg.w; return mat3(sTu,sTv,N); '} vec3 dp1=dFdx(vW), dp2=dFdy(vW); vec2 du1=dFdx(vUv), du2=dFdy(vUv);

// skin: body + head (+hands) share this exact recipe; body adds ambient-wrap and edge fresnel, head adds wrinkle normals

const PCA={ready:false};

function applyPCA(o){

const BONES={}; let REST=null;
