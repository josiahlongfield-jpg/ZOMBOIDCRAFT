<script type="module">

const T={

 bodyCtl:tx('storm_cortana_default_body_control',false),

 rampHair:tx('storm_cortana_default_ramp_hair_diff'), mask:tx('storm_cortana_default_body_mask_diff',false),
 headDiff:tx('storm_cortana_default_head_diff'), headCtl:tx('storm_cortana_default_head_control',false),

const U={f_browUL:{value:0},f_browUR:{value:0},f_browIn:{value:0},f_browDn:{value:0},f_smile:{value:0},f_frown:{value:0},f_wide:{value:0},f_round:{value:0},f_blinkL:{value:0},f_blinkR:{value:0},f_squint:{value:0},f_lipIn:{value:0},time:{value:0},rez:{value:1.5},minY:{value:0},maxY:{value:1.8},glow:{value:1.0}};
const common=`
uniform float time,rez,minY,maxY,glow; varying vec2 vUv; varying vec3 vN,vV,vW;
uniform sampler2D ramp,scan,noise;
float rezMask(out float edge){
  float h=(vW.y-minY)/(maxY-minY);

  float d=rez-(h+n);           // >0 visible

float scanl(){ return 0.75+0.25*texture2D(scan,vec2(0.5,vW.y*55.0-time*0.6)).r; }

const vs=`varying vec2 vUv; varying vec3 vN,vV,vW;
uniform float faceK,f_browUL,f_browUR,f_browIn,f_browDn,f_smile,f_frown,f_wide,f_round,f_blinkL,f_blinkR,f_squint,f_lipIn;
#include <common>
#include <skinning_pars_vertex>
float gg(vec3 p,vec3 c,float r){ vec3 d=p-c; return exp(-dot(d,d)/(r*r)); }
vec3 lid(vec3 p,vec3 e,float bl,float sq){
  vec3 q=p-e; float dist=length(q); float w=smoothstep(0.024,0.013,dist)*smoothstep(0.0,0.03,q.z+0.01);

  const REAL=P.has('real');

  const u={...U,faceK:{value:0},ramp:{value:T.ramp},scan:{value:T.scan},noise:{value:T.noise}};
  if(kind==='body'){u.nrm={value:T.bodyN};u.nrmK={value:P.has('nk')?+P.get('nk'):1.0};u.diff={value:T.bodyDiff};u.ctl={value:T.bodyCtl};u.flow={value:T.flow};u.mask={value:T.mask};}
  if(kind==='head'){u.nrm={value:T.headN};u.nrmK={value:P.has('hk')?+P.get('hk'):0.5};u.diff={value:T.headDiff};u.ctl={value:T.headCtl};u.flow={value:T.flow};u.mask={value:T.mask};}
  if(kind==='hair'){u.nrm={value:T.hairN};u.nrmK={value:1.0};u.diff={value:T.hair};u.rampHair={value:T.rampHair};}
  if(REAL){u.isHair={value:kind==='hair'?1:0}; if(!u.rampHair)u.rampHair={value:T.rampHair}; if(!u.ctl)u.ctl={value:T.headCtl};
   const lp=(P.get('lights')||'0.3,0.6,0.75;-0.8,0.3,0.2;0.6,0.2,-0.8').split(';').map(t=>new THREE.Vector3(...t.split(',').map(Number)).normalize());
   u.L1={value:lp[0]};u.L2={value:lp[1]};u.L3={value:lp[2]};u.Lk={value:new THREE.Vector3(...(P.get('lk')||'1,0.6,0.8').split(',').map(Number))};}

  return new THREE.ShaderMaterial({uniforms:u,vertexShader:vs,fragmentShader:common+body,transparent:true,
    blending:THREE.NormalBlending,depthWrite:true,alphaTest:0.0,side:kind==='hair'?THREE.DoubleSide:THREE.FrontSide});
}
// plinth: projector disc + light cone
const plinth=new THREE.Group();
const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.36,0.06,48),new THREE.MeshBasicMaterial({color:0x10161c}));

  model=g.scene;

     let k='body'; if(n.includes('head'))k='head'; else if(n.includes('hair'))k='hair'; else if(n.includes('eyes'))k='eye';

const PCA={ready:false};
(async()=>{ try{
  const [map,coef,b5,b1]=await Promise.all([fetch('pca_map.json').then(r=>r.json()),fetch('pca_m093.json').then(r=>r.json()),
    fetch('pca_mesh5.bin').then(r=>r.arrayBuffer()),fetch('pca_mesh1.bin').then(r=>r.arrayBuffer())]);
  PCA.map=map; PCA.coef=coef; PCA.basis={5:new Float32Array(b5),1:new Float32Array(b1)}; PCA.ready=true; }catch(e){console.log('pca load fail',e);} })();
function applyPCA(o){
  if(!PCA.ready||!model) return;
  if(!PCA.meshes){ PCA.meshes=[]; model.traverse(x=>{ if(x.isMesh){ const mn=x.parent&&x.parent.name&&PCA.map[x.parent.name]?x.parent.name:(PCA.map[x.name]?x.name:null);
      if(mn){ PCA.meshes.push({obj:x,mn,base:x.geometry.attributes.position.array.slice()}); } } });
    // assign primitive index in order of appearance per mesh name
    const cnt={}; for(const m of PCA.meshes){ cnt[m.mn]=(cnt[m.mn]||0); m.pi=cnt[m.mn]++; } }
  for(const m of PCA.meshes){
    const info=PCA.map[m.mn], mesh=info.mesh, idx=info.prims[m.pi]; if(!idx) continue;
    const pos=m.obj.geometry.attributes.position.array; pos.set(m.base);
    if(o&&o.shot){ const C=PCA.coef[mesh].coef[o.shot]; if(!C) continue; const f=Math.min(C.length-1,Math.max(0,o.frame|0)); const c=C[f];
      const B=PCA.basis[mesh], nv=PCA.coef[mesh].nv, nc=PCA.coef[mesh].ncomp, s=o.scale??0.84;
      for(let v=0;v<idx.length;v++){ const j=idx[v]; if(j<0) continue; let dx=0,dy=0,dz=0;
        for(let k=0;k<nc;k++){ const w=c[k]; if(w===0) continue; const b=(k*nv+j)*3; dx+=w*B[b]; dy+=w*B[b+1]; dz+=w*B[b+2]; }
        pos[v*3]+=dx*s; pos[v*3+1]+=dy*s; pos[v*3+2]+=dz*s; } }

}
const BONES={}; let REST=null;

const ANIM={};
fetch('bone_names.json').then(r=>r.json()).then(n=>ANIM.names=n);
function loadAnim(f){ return fetch(f).then(r=>r.json()).then(j=>{ANIM.data=j;}); }
window.loadAnim=loadAnim;
function applyAnim(a){
  const A=ANIM.data&&ANIM.data[a.shot]; if(!A||!ANIM.names) return false;

  return true; }
function pose(t,o){
  if(!REST){ REST={}; model.traverse(x=>{ if(x.isBone){BONES[x.name]=x; REST[x.name]=x.quaternion.clone();} }); }
  if(o.anim && applyAnim(o.anim)) { if(o.look) rotW(BONES.b_head,new THREE.Vector3(0,1,0),o.look); return; }
  for(const k in REST) BONES[k].quaternion.copy(REST[k]);
  const Z=new THREE.Vector3(0,0,1),Y=new THREE.Vector3(0,1,0),X=new THREE.Vector3(1,0,0);
  const br=Math.sin(t*1.6)*0.5+0.5, sw=Math.sin(t*0.55);
  const arm=o.arm??0.62;
  rotW(BONES.b_l_upperarm,Z,-arm-0.03*br); rotW(BONES.b_r_upperarm,Z,arm+0.03*br);
  rotW(BONES.b_l_forearm,Y,0.25); rotW(BONES.b_r_forearm,Y,-0.25);
  rotW(BONES.b_spine2,X,0.02*br); rotW(BONES.b_spine3,X,0.015*br);
  rotW(BONES.b_pelvis,Z,0.035*sw); rotW(BONES.b_spine1,Z,-0.03*sw);
  rotW(BONES.b_head,Y,(o.look??0)+0.12*Math.sin(t*0.4)); rotW(BONES.b_head,X,0.04*Math.sin(t*0.7));
  rotW(BONES.b_l_thigh,Z,-0.02*sw); rotW(BONES.b_r_thigh,Z,-0.02*sw);
  if(o.nod) rotW(BONES.b_head,X,o.nod); if(o.tilt) rotW(BONES.b_head,Z,o.tilt);
  if(o.jaw) rotW(BONES.b_jaw,X,o.jaw);
  if(o.eyeX||o.eyeY){ for(const e of [BONES.b_l_eye,BONES.b_r_eye]){ rotW(e,Y,o.eyeX||0); rotW(e,X,o.eyeY||0);} }
}
window.frame=(t,o={})=>{ if(model && (o.pose??true)) pose(t,o); applyPCA(o.pca);
  for(const k in U) if(k.startsWith('f_')) U[k].value=(o.face&&o.face[k.slice(2)])||0;
  U.time.value=t; U.rez.value=o.rez??1.5; U.glow.value=o.glow??1.0;
  const a=o.yaw??0, dist=o.dist??3.2, ty=o.ty??0.95, cy=o.cy??1.05;
  cam.position.set(Math.sin(a)*dist,cy,Math.cos(a)*dist); cam.lookAt(0,ty,0);
  if(model){ model.position.y=(o.bob??0)+0.02-(window.BOX?window.BOX[0][1]:0); model.rotation.y=o.rot??0; }
  ren.render(scene,cam); return ren.domElement.toDataURL('image/png');
};
