<!doctype html><html><body style="margin:0;background:#2a2d33"><canvas id="c" width="1200" height="600"></canvas>
<script type="importmap">{"imports":{"three":"./three.js"}}</script>
<script type="module">
import * as THREE from 'three';
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true}); R.setClearColor(0x2a2d33);
const cam=new THREE.PerspectiveCamera(20,2,0.01,100);
window.show=async(dir,az,el)=>{
  const scene=new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xffffff,0x666666,2.8)); const dl=new THREE.DirectionalLight(0xffffff,2.6); dl.position.set(1,2,1.5); scene.add(dl);
  const d2=new THREE.DirectionalLight(0xffffff,1.0); d2.position.set(-1,0.5,-1); scene.add(d2);
  const objs=await (await fetch(dir+'/scene.json')).json(); const TL=new THREE.TextureLoader(); const box=new THREE.Box3();
  for(const o of objs){ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(o.p,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(o.u,2)); g.computeVertexNormals(); g.computeBoundingBox(); box.union(g.boundingBox);
    let t=null; try{t=await TL.loadAsync(dir+'/'+o.tex); t.flipY=false; t.colorSpace=THREE.SRGBColorSpace;}catch(e){}
    scene.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:t,roughness:0.75,metalness:0.1,side:THREE.DoubleSide}))); }
  const c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3()); const r=Math.max(s.x,s.y,s.z)*0.5;
  const t=Math.tan(THREE.MathUtils.degToRad(10)); const dist=Math.max(s.y/2/t, Math.max(s.z,s.x)/2/(2*t))*1.2+r*0.6;
  cam.position.set(c.x+Math.sin(az)*Math.cos(el)*dist,c.y+Math.sin(el)*dist,c.z+Math.cos(az)*Math.cos(el)*dist); cam.lookAt(c); cam.near=dist/50; cam.far=dist*5; cam.updateProjectionMatrix(); R.render(scene,cam); return objs.length; };
window.ready=true;
</script></body></html>
