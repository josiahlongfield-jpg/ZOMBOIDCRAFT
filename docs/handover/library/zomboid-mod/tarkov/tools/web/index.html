async function geo(h){
  const b=await B(h.file); const n=h.n; let o=0;

function mat(m){

}
async function build(nodes){

}

    const P2=[2,3,4,5].map(d=>wp('RDigit'+d+'2')).reduce((a,b)=>a.add(b),V3(0,0,0)).multiplyScalar(0.25); const ours=posOf(ZREF[2]).distanceTo(posOf(ZREF[4])); window.ZK=window.ZKFORCE||W.distanceTo(P2)/ours; window.ZXK=W.distanceTo(K); const Sc=new THREE.Matrix4().makeScale(ZK,ZK,ZK); ZREF.forEach(m=>m.premultiply(Sc)); }

    const tp=posOf(M[o+3]), tt=Z.ttip.clone().applyMatrix4(X), T1=wp(s+'Digit11'), dT=tip(1).sub(T1).normalize();
    M[o+3].premultiply(about(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(tt.clone().sub(tp).normalize(),dT)),tp));
    // four fingers: each bent at three joints like Tarkov's matching finger (her finger is one piece, bent along its length)
    const piv=posOf(M[o+4]), ax=V3(0,0,1).applyMatrix4(new THREE.Matrix4().extractRotation(A)).normalize(), R4=new THREE.Matrix4().extractRotation(M[o+4]);
    const sang=(a,b)=>{ const ap=a.clone().sub(ax.clone().multiplyScalar(a.dot(ax))).normalize(), bp=b.clone().sub(ax.clone().multiplyScalar(b.dot(ax))).normalize(); return Math.atan2(new THREE.Vector3().crossVectors(ap,bp).dot(ax), ap.dot(bp)); };
    Z.curve=Z.fc.map((fc,k)=>{ const d=k+2, Q=[wp(s+'Digit'+d+'1'),wp(s+'Digit'+d+'2'),wp(s+'Digit'+d+'3')]; Q.push(Q[2].clone().add(Q[2].clone().sub(Q[1]).multiplyScalar(0.85)));
      const e=[0,1,2].map(m=>Q[m+1].clone().sub(Q[m]).normalize()), len=[0,1,2].map(m=>Q[m+1].distanceTo(Q[m])), tot=len[0]+len[1]+len[2];
      const J=[fc.J0, fc.J0+(1-fc.J0)*len[1]/(len[1]+len[2])], W=0.05;
      const tan=u=>{ let t=e[0].clone(); for(let m=0;m<2;m++){ const w=Math.min(1,Math.max(0,(u-J[m]+W)/(2*W))); t.lerp(e[m+1],w); } return t.normalize(); };
      const NS=48, P=[V3(0,0,0)], T=[tan(0)]; for(let m=1;m<=NS;m++){ const u=m/NS; P.push(P[m-1].clone().add(tan(u-0.5/NS).multiplyScalar(fc.L/NS))); T.push(tan(u)); }
      const base=fc.base.clone().applyMatrix4(RxH).add(P0), lw=V3(0,0,1).applyMatrix4(new THREE.Matrix4().extractRotation(A)).normalize();
      return {P:P.map(p=>p.add(base)), T, lw, NS}; });
    // arm: shoulder where Tarkov's is, elbow solved toward Tarkov's elbow
    const Wn=posOf(M[o+2]); let S=wp(s+'Upperarm'); const E=wp(s+'Forearm1');
    let d=Wn.distanceTo(S); const reach=(Z.L1+Z.L2)*0.995; if(d>reach){ S=Wn.clone().add(S.clone().sub(Wn).normalize().multiplyScalar(reach)); d=reach; }
    const dir=Wn.clone().sub(S).normalize(), a=(Z.L1*Z.L1-Z.L2*Z.L2+d*d)/(2*d), h=Math.sqrt(Math.max(0,Z.L1*Z.L1-a*a));
    const pe=E.clone().sub(S); const pv=pe.sub(dir.clone().multiplyScalar(pe.dot(dir))).normalize();
    const El=S.clone().add(dir.clone().multiplyScalar(a)).add(pv.multiplyScalar(h));
    const Fu=frame(El.clone().sub(S), Wn.clone().sub(S)), Fu0=frame(Z.E0.clone().sub(Z.U0), Z.w0.clone().sub(Z.U0));
    M[o]=new THREE.Matrix4().makeTranslation(S.x,S.y,S.z).multiply(Fu.multiply(Fu0.clone().invert())).multiply(new THREE.Matrix4().makeTranslation(-Z.U0.x,-Z.U0.y,-Z.U0.z)).multiply(ZREF[o]);
    const latN=V3(0,0,1).applyMatrix4(new THREE.Matrix4().extractRotation(A)), lat0=V3(0,0,1).applyMatrix4(new THREE.Matrix4().extractRotation(Z.B));
    const Ff=frame(Wn.clone().sub(El), latN), Ff0=frame(Z.w0.clone().sub(Z.E0), lat0);
    M[o+1]=new THREE.Matrix4().makeTranslation(El.x,El.y,El.z).multiply(Ff.multiply(Ff0.clone().invert())).multiply(new THREE.Matrix4().makeTranslation(-Z.E0.x,-Z.E0.y,-Z.E0.z)).multiply(ZREF[o+1]);
  }
  const P=ZG.attributes.position.array, t=V3(0,0,0), acc=V3(0,0,0);
  const sm=(x,e)=>Math.min(1,Math.max(0,(x-e+0.06)/0.12));
  ZA.infl.forEach((row,i)=>{ acc.set(0,0,0); for(const [j,w,x,y,z] of row){ t.set(x,y,z).applyMatrix4(M[j]).multiplyScalar(w); acc.add(t);}
    const fu=ZA.fu[i]; if(fu){ const c=ZINFO[fu.s].curve[fu.k]; const m=Math.min(c.NS,Math.round(fu.sv*c.NS)); const t=c.T[m], nn=new THREE.Vector3().crossVectors(t,c.lw).normalize(), l2=new THREE.Vector3().crossVectors(nn,t).normalize();
      const cp=c.P[m].clone().add(t.clone().multiplyScalar(fu.ot)).add(l2.multiplyScalar(fu.ol)).add(nn.multiplyScalar(fu.on)); acc.lerp(cp,fu.w); }
    P[i*3]=acc.x;P[i*3+1]=acc.y;P[i*3+2]=acc.z; });
  ZG.attributes.position.needsUpdate=true; ZG.computeVertexNormals();
};

window.zdebug3=(c,f)=>{ window.IK=false; window.ALLLAYERS=true; pose(c,f); zpose(); const P=ZG.attributes.position.array; const out=[];
  for(const Z of ZINFO){ const s=Z.o?'L':'R'; const si=Z.o?1:0; for(let k=0;k<4;k++){ let best=-1,bs=-1; ZA.fu.forEach((u,i)=>{ if(u&&u.s===si&&u.k===k&&u.sv>bs){bs=u.sv;best=i;} });
    const cnt=ZA.fu.filter(u=>u&&u.s===si&&u.k===k).length; const ours=V3(P[best*3],P[best*3+1],P[best*3+2]); const d=k+2, d2=wp(s+'Digit'+d+'2'), d3=wp(s+'Digit'+d+'3'); const tt=d3.clone().add(d3.clone().sub(d2).multiplyScalar(0.85));
    out.push(s+k+' n='+cnt+' sv='+bs.toFixed(2)+' err='+ours.distanceTo(tt).toFixed(3)+' base->D1='+Z.curve[k].P[0].distanceTo(wp(s+'Digit'+d+'1')).toFixed(3)+' L='+Z.fc[k].L.toFixed(3)); } }
  return out.join('\n'); };
window.zdebug4=()=>{ window.IK=false; window.ALLLAYERS=true; pose(null,0); const out=[];

    const tk=[2,3,4,5].map(d=>{ const a=wp(s+'Digit'+d+'2'), b=wp(s+'Digit'+d+'3'); return b.clone().add(b.clone().sub(a).multiplyScalar(0.85)).sub(P).applyMatrix4(Ai).toArray().map(x=>x.toFixed(3)); });
    const th=Z.ttip.clone().sub(p0).applyMatrix4(Bi).toArray().map(x=>x.toFixed(3)), tth=(()=>{const a=wp(s+'Digit12'), b=wp(s+'Digit13'); return b.clone().add(b.clone().sub(a)).sub(P).applyMatrix4(Ai).toArray().map(x=>x.toFixed(3));})();
    out.push(s+' ours tips '+JSON.stringify(ours)+' thumb '+th+'\n  tark tips '+JSON.stringify(tk)+' thumb '+tth); }
  return out.join('\n'); };
