<script type="module">

const i32=()=>{const v=dv.getInt32(o);o+=4;return v}, f32=()=>{const v=dv.getFloat32(o);o+=4;return v}, i8=()=>dv.getInt8(o++), u8=()=>dv.getUint8(o++), i16=()=>{const v=dv.getInt16(o);o+=2;return v}, u16=()=>{const v=dv.getUint16(o);o+=2;return v};
