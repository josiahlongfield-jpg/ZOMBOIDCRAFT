<title>Reload Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Workshop bench: three views on top, a key timeline under them, the key's sliders on the side (stacked on a phone). Single dark look. */
:root {
  --bg: #15171a; --panel: #1d2024; --line: #2c3036; --fg: #e4e6e9; --dim: #8c939c; --accent: #e0a64a; --sel: #f2c46d;
  --bad: #e25d4f; --good: #6fbf73; --lane: #23272c; --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 13px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; box-sizing: border-box; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; }
button { padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.on { background: var(--accent); color: #1a1408; border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
select { padding: 5px 6px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.bar h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .02em; }
.status { color: var(--dim); font-size: 12px; margin-left: auto; }
.status.bad { color: var(--bad); }
.tnum { font-family: var(--mono); font-variant-numeric: tabular-nums; }
/* the views stay on screen while the sliders scroll under them (Josiah 2026-11-04) */
.views { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 4px 6px; }
.view { position: relative; background: #0d0e10; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; cursor: pointer; }
.view.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.view canvas { width: 100%; height: 100%; display: block; }
.view .lbl { position: absolute; left: 8px; top: 6px; font-size: 12px; background: rgba(13,14,16,.7); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
.view .warn { position: absolute; left: 8px; bottom: 6px; font-size: 12px; color: var(--bad); background: rgba(13,14,16,.75); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
.vtabs { display: none; gap: 6px; margin-bottom: 8px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 10px; margin-top: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-width: 0; }
.panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
.transport { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.tl { position: relative; user-select: none; touch-action: none; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; height: 26px; }
.row .name { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; cursor: pointer; }
.row.cur .name { color: var(--fg); }
.lane { position: relative; height: 18px; background: var(--lane); border-radius: 3px; }
.key { position: absolute; top: 2px; width: 14px; height: 14px; margin-left: -7px; transform: rotate(45deg) scale(.8); background: var(--dim); border: 1px solid #0006; cursor: grab; }
.key.ev { transform: none; width: 6px; margin-left: -3px; border-radius: 2px; background: #7aa6d8; }
.key.sel { background: var(--sel); box-shadow: 0 0 0 2px #0008; z-index: 2; }
.ruler { height: 18px; position: relative; color: var(--dim); font-size: 10px; }
.ruler span { position: absolute; transform: translateX(-50%); }
.head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; z-index: 3; }
.scrub { height: 20px; margin-left: 96px; position: relative; cursor: ew-resize; background: var(--lane); border-radius: 3px; margin-bottom: 4px; }
.field { display: grid; grid-template-columns: 92px minmax(0, 1fr) 64px; gap: 6px; align-items: center; margin: 4px 0; }
.field label { color: var(--dim); font-size: 12px; }
.field input[type=number] { width: 100%; padding: 3px 4px; font-family: var(--mono); font-size: 12px; }
.field input[type=range] { width: 100%; accent-color: var(--accent); background: none; border: 0; }
.grp { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; }
.grp > div:first-child { font-size: 12px; margin-bottom: 2px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.note { color: var(--dim); font-size: 12px; line-height: 1.45; }
.confirm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; color: var(--bad); }
@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 700px) {
  html, body { height: auto; min-height: 100%; }
  .vtabs { display: flex; flex-wrap: wrap; }
  .views { grid-template-columns: minmax(0, 1fr); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 4px 6px; }
  .view { aspect-ratio: 16 / 9; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .view:not(.active) { display: none; }
  .row { grid-template-columns: 70px minmax(0, 1fr); }
  .scrub { margin-left: 70px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="bar">
  <h1>Reload Editor</h1>
  <select id="gun" aria-label="Gun"></select>
  <button id="undo" title="Undo">Undo</button>
  <button id="redo" title="Redo">Redo</button>
  <span class="status" id="status">Loading…</span>
</div>
<div class="vtabs" id="vtabs"></div>
<div class="views" id="views"></div>
<div class="main">
  <div class="panel">
    <div class="transport">
      <button id="play">Play</button>
      <select id="speed" aria-label="Speed"><option value="1">Full speed</option><option value="0.5">Half speed</option><option value="0.25">Quarter speed</option></select>
      <button id="prevk" title="Previous key">◀ key</button>
      <button id="nextk" title="Next key">key ▶</button>
      <span class="tnum" id="time">0.00 s</span>
      <span class="note" id="editing"></span>
    </div>
    <div class="scrub" id="scrub"><div class="head" id="head0"></div></div>
    <div class="tl" id="tl"></div>
    <div class="btns">
      <button id="addk">Add key at playhead</button>
      <button id="delk">Delete key</button>
      <label class="note">Clip length <input id="dur" type="number" step="0.05" min="0.5" max="10" style="width:64px"> s</label>
      <label class="note">Arm <select id="solver" title="How the arms are solved in this view"><option value="natural">Natural (whole arm moves together)</option><option value="plain">Plain (older)</option></select></label>
    </div>
  </div>
  <div class="panel" id="insp"></div>
</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script src="engine.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const E = window.REngine;
const VIEWS = { fp: 'First person', tp: 'Third person, standing', ta: 'Third person, aimed (moving)' };
const VK = Object.keys(VIEWS);
const $ = id => document.getElementById(id);
const f32 = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new Float32Array(u.buffer); };

const NAMES = { AR57_PDW: 'AR-57 PDW', Colt1911: 'Colt 1911', AAC_Honey: 'AAC Honey Badger', L86: 'L86 LSW', M2Carbine: 'M2 Carbine', AssaultRifle2: 'M14-type rifle',
  American180: 'American-180', M870_CQB: 'Remington 870 CQB', Winchester1866: 'Winchester 1866', SW_M500: 'S&W Model 500', BOAR: 'Big Boar .50', RPG_7: 'RPG-7',
  TenPointTurbo_XLT: 'TenPoint crossbow', DSHK: 'DShK', Bush_AR15_MOE: 'AR-15 (Bushmaster MOE)' };

const fresh = () => Object.fromEntries(VK.map(v => [v, flatten(kit.spec, v)]));
const spec = () => data[active];

// ------------------------------------------------------------------ views (three.js)
const R3 = {};

    const d = document.createElement('div'); d.className = 'view'; d.id = 'v_' + v;
    d.innerHTML = `<canvas></canvas><div class="lbl">${VIEWS[v]}</div><div class="warn" hidden></div>`;
    host.appendChild(d);
    const r = new THREE.WebGLRenderer({ canvas: d.querySelector('canvas'), antialias: true }); r.setClearColor(0x2a2d31); r.outputColorSpace = THREE.SRGBColorSpace;
    const cam = new THREE.PerspectiveCamera(v === 'fp' ? 70 : 40, 16 / 10, 0.03, 50);

    if (v === 'tp') { cam.position.set(-0.42, 1.5, 1.65); }

    if (v !== 'fp') { ctl = new OrbitControls(cam, d.querySelector('canvas')); ctl.target.set(v === 'tp' ? 0.05 : 0.0, v === 'tp' ? 1.1 : 1.2, v === 'tp' ? 0.15 : 0.1); ctl.enableDamping = false; ctl.update(); ctl.addEventListener('change', () => draw(v)); }

    d.addEventListener('pointerdown', () => setActive(v));

function size(v) { const o = R3[v], w = o.div.clientWidth, h = o.div.clientHeight; if (!w || !h) return; o.r.setPixelRatio(Math.min(2, devicePixelRatio)); o.r.setSize(w, h, false); o.cam.aspect = w / h; o.cam.updateProjectionMatrix(); }
let skinTex = null, gunTex = null, P = null, J = null, Wt = null, UV = null;
async function texFrom(b64) { const t = await new THREE.TextureLoader().loadAsync('data:image/png;base64,' + b64); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t; }

    const o = R3[v];
    for (const m of Object.values(o.parts)) { o.sc.remove(m); m.geometry.dispose(); }

      if (g.u) { geo.setAttribute('uv', new THREE.BufferAttribute(f32(g.u), 2)); mat = new THREE.MeshLambertMaterial({ map: gunTex, side: THREE.DoubleSide, alphaTest: 0.1 }); }

function frameAt(v) { const fr = baked[v].frames; return fr[Math.min(fr.length - 1, Math.max(0, Math.round(t * 30)))]; }

  w.hidden = !bad.length; w.textContent = bad.map(s => `${s === 'L' ? 'Left' : 'Right'} hand can't reach (${Math.round(fr.miss[s] * 100)} cm short)`).join(' · ');

}
const drawAll = () => VK.forEach(draw);

// ------------------------------------------------------------------ baking + edits
let bakeQueued = false;
function rebake(only) { for (const v of only ? [only] : VK) baked[v] = E.bake(S, kit, data[v], v); }
function changed(v = active) {

  if (!bakeQueued) { bakeQueued = true; requestAnimationFrame(() => { bakeQueued = false; rebake(v); drawAll(); drawTimeline(); }); }

}
function snapshot() { undo.push(JSON.stringify(data)); if (undo.length > 80) undo.shift(); redo = []; syncUndo(); }
function syncUndo() { $('undo').disabled = !undo.length; $('redo').disabled = !redo.length; }
$('undo').onclick = () => { if (!undo.length) return; redo.push(JSON.stringify(data)); data = JSON.parse(undo.pop()); afterJump(); };
$('redo').onclick = () => { if (!redo.length) return; undo.push(JSON.stringify(data)); data = JSON.parse(redo.pop()); afterJump(); };
function afterJump() { syncUndo(); rebake(); clampSel(); drawAll(); drawTimeline(); inspector(); dirty = true; scheduleSave(); }

// ------------------------------------------------------------------ saving (online, per gun)
function setStatus(s, bad) { const el = $('status'); el.textContent = s; el.classList.toggle('bad', !!bad); }
function scheduleSave() { clearTimeout(saveTimer); setStatus('Unsaved changes'); saveTimer = setTimeout(save, 1200); }
async function save() {

  try { await db.doc('reloads/' + gid).set({ json: body, t: Date.now() }); dirty = false; setStatus('Saved online'); }
  catch (e) { setStatus('Online save failed, kept on this device (' + (e && (e.code || e.message) || 'error') + ')', true); }

addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty) save(); });

// ------------------------------------------------------------------ timeline
function tracks() {
  const s = spec(); const out = [['gun', 'Gun'], ['L', 'Left hand'], ['R', 'Right hand']];
  for (const n of Object.keys(s.moves)) out.push(['m:' + n, partName(n)]);
  out.push(['ev', 'Events']); return out;
}
function keysOf(track) { const s = spec(); if (track === 'gun' || track === 'L' || track === 'R') return s[track]; if (track.startsWith('m:')) return s.moves[track.slice(2)]; return s.events; }

  tl.appendChild(ru);
  for (const [id, label] of tracks()) {
    const row = document.createElement('div'); row.className = 'row' + (sel.track === id ? ' cur' : '');
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = label; nm.title = label; nm.onclick = () => { sel = { track: id, i: 0 }; clampSel(); refreshSel(); };
    const lane = document.createElement('div'); lane.className = 'lane'; row.append(nm, lane);
    keysOf(id).forEach((k, i) => {

      d.onpointerdown = ev => startDrag(ev, id, i, lane);

}
function placeHead() {
  const s = spec(), tl = $('tl'), lane = tl.querySelector('.lane'); $('time').textContent = t.toFixed(2) + ' s';
  const sc = $('scrub'); $('head0').style.left = (t / s.dur * 100) + '%';
  const h = $('head1'); if (h && lane) { const r = lane.getBoundingClientRect(), tr = tl.getBoundingClientRect(); h.style.left = (r.left - tr.left + t / s.dur * r.width) + 'px'; }
}
function evLabel(e) {

  return `${e[0].toFixed(2)} s · ` + ({ grab: `${p}: picked up by ${h}`, drop: `${p}: let go, falls`, show: `${p}: appears in ${h}`, seat: `${p}: locks into the gun`, hide: `${p}: hidden` }[e[2]] || `${p}: ${e[2]}`);
}
function sortTrack(id) {

}
function startDrag(ev, id, i, lane) {

  const k = keysOf(id)[i], r = lane.getBoundingClientRect(), s = spec(); const t0 = k[0], x0 = ev.clientX; let moved = false;
  const mv = e => {
    const dt = (e.clientX - x0) / r.width * s.dur; if (!moved && Math.abs(e.clientX - x0) < 3) return;
    if (!moved) { snapshot(); moved = true; }
    setKeyTime(id, k, Math.round(Math.max(0, Math.min(s.dur, t0 + dt)) * 100) / 100); t = k[0]; changed(); drawTimeline(); inspector();
  };
