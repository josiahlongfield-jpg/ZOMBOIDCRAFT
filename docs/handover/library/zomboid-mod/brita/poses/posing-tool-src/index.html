<title>Survivor Arms Posing Tool</title>
<style>
:root { color-scheme: dark; --bg: #15181a; --panel: #1f2427; --line: #343b40; --fg: #e4e8ea; --muted: #97a1a7; --accent: #8fbf6a; --warn: #ff5a4f; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .grow { flex: 1; }
button, label.btn { background: #2b3236; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; font: inherit; }
button:hover, label.btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
input[type=file] { display: none; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 10px; padding: 10px; }
.views { display: grid; gap: 10px; align-content: start; }
.view { position: relative; background: #dfe3e6; border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 9; }
.view canvas { display: block; width: 100%; height: 100%; }
.view .tag { position: absolute; left: 8px; top: 6px; background: rgba(0,0,0,.55); padding: 2px 7px; border-radius: 4px; font-size: 12px; }
#lens { position: absolute; left: 50%; top: 50%; height: var(--d) !important; aspect-ratio: 1; transform: translate(-50%,-50%); border: 2px solid rgba(224,36,42,.8); border-radius: 50%; pointer-events: none; }
.view .cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%); pointer-events: none; }
.view .cross::before, .view .cross::after { content: ""; position: absolute; background: #e0242a; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.view .cross::before { left: 10px; top: 0; width: 2px; height: 22px; }
.view .cross::after { top: 10px; left: 0; height: 2px; width: 22px; }
.view img.overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; display: none; }
.sidebtns { position: absolute; right: 8px; top: 6px; display: flex; gap: 4px; }
.sidebtns button { padding: 2px 7px; font-size: 12px; background: rgba(0,0,0,.55); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-y: auto; max-height: calc(100vh - 70px); }
details { border-bottom: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
summary .clash { font-weight: 500; font-size: 12px; color: var(--muted); }
summary .clash.bad { color: var(--warn); }
.row { display: grid; grid-template-columns: 128px minmax(0,1fr) 58px; gap: 6px; align-items: center; margin: 5px 0; }
.row span { color: var(--muted); font-size: 12px; }
.row input[type=range] { width: 100%; accent-color: var(--accent); }
.row input[type=number] { width: 54px; background: #15181a; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; font: inherit; font-size: 12px; }
.reset { font-size: 12px; padding: 2px 8px; margin-top: 4px; }
textarea { width: 100%; height: 110px; background: #15181a; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: 11px/1.3 ui-monospace, Consolas, monospace; margin-top: 8px; }
.hint { color: var(--muted); font-size: 12px; margin: 6px 0; }
#drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.75); font-size: 20px; z-index: 5; }
#start { max-width: 560px; margin: 60px auto; text-align: center; color: var(--muted); }
#start h2 { color: var(--fg); }
@media (max-width: 900px) { main { grid-template-columns: minmax(0,1fr); } .panel { max-height: none; } }
/* PC: the sliders ride down the page beside the views, so they're in reach next to the free-look side view too */
@media (min-width: 901px) { .panel { position: sticky; top: 10px; align-self: start; max-height: calc(100vh - 20px); } }
#sync { color: var(--muted); font-size: 12px; }
.att .pick { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 6px; align-items: center; margin: 6px 0; }
.att .pick span { color: var(--muted); font-size: 12px; }
.att select { min-width: 0; background: #2b3236; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
@media (max-width: 700px) { .att .pick { grid-template-columns: 96px minmax(0,1fr); } .att select { font-size: 16px; } }
.follow { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0 4px; }
.follow label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.follow select { flex: 1; min-width: 0; background: #2b3236; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
#review { position: fixed; inset: 0; z-index: 6; background: var(--bg); overflow-y: auto; padding: 12px; }
#review .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; top: -12px; background: var(--bg); padding: 8px 0; z-index: 1; }
#review .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
#review .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
#review .cell.good { border-color: var(--accent); }
#review .cell.fix { border-color: var(--warn); }
#review .cell img { width: 100%; aspect-ratio: 16/9; display: block; border-radius: 4px; cursor: pointer; background: #dfe3e6; }
#review .cell .nm { font-weight: 600; margin: 4px 0 2px; }
#review .cell .src { color: var(--muted); font-size: 12px; min-height: 1.4em; }
#review .cell .btns { display: flex; gap: 6px; margin-top: 4px; }
#review .cell .btns button.on.g { background: var(--accent); color: #111; }
#review .cell .btns button.on.f { background: var(--warn); color: #111; }
#sync.ok { color: var(--accent); }
#sync.bad { color: var(--warn); }
.vtoggle { display: none; gap: 6px; }
.modes { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.modes button { border: 0; border-radius: 0; }
#gunpick { background: #2b3236; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; font: inherit; max-width: 100%; }
.modes button.on { background: var(--accent); color: #111; font-weight: 600; }
.vtoggle button.on { border-color: var(--accent); color: var(--accent); }
@media (max-width: 700px) {
  header { padding: 8px 10px; gap: 8px; }
  header h1 { width: 100%; }
  header .grow { display: none; }
  main { padding: 6px 10px; gap: 8px; }
  .views { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 4px 0 6px; gap: 6px; }
  .vtoggle { display: flex; }
  .view.mhide { display: none; }
  .view .tag { font-size: 11px; }
  .sidebtns { top: auto; bottom: 6px; right: 6px; left: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .row { grid-template-columns: 96px minmax(0,1fr) 56px; }
  .row input[type=range] { height: 28px; }
  .row input[type=number] { font-size: 16px; width: 56px; }
  .panel { padding: 8px; }
}
</style>

<header>
  <h1>Survivor arms posing tool</h1>
  <select id="gunpick" aria-label="Gun"></select>
  <span class="modes" role="group" aria-label="Pose"><button id="m-hip" class="on">Hip fire</button><button id="m-ads">Aim down sights</button><button id="m-tpready">3rd person: ready</button><button id="m-tpaim">3rd person: aim</button></span>
  <label class="btn">Overlay a picture<input id="overlayfile" type="file" accept="image/*"></label>

  <label style="display:flex;gap:6px;align-items:center;color:var(--muted)"><input id="street" type="checkbox"> Street behind</label>

  <button id="reviewbtn" hidden>Review all guns</button>

</header>
<div id="start"><h2>Loading her arms and the guns…</h2><p>This takes a few seconds on a phone.</p></div>
<main id="app" style="display:none">
  <div class="views">
    <div class="vtoggle"><button data-v="0" class="on" id="vt0">Game view</button><button data-v="1" id="vt1">Side view</button></div>
    <div class="view" id="v1"><span class="tag" id="v1tag">Her eyes (game view, 70° FOV)</span><div class="cross"></div><div id="lens" hidden></div><img class="overlay" id="overlay" alt=""></div>

  </div>
</main>
<div id="review" hidden><div class="bar"><b id="reviewtitle"></b><span class="grow"></span><span id="reviewcount" style="color:var(--muted)"></span><button id="reviewclose" class="primary">Close</button></div><div class="grid" id="reviewgrid"></div></div>
<div id="drop">Drop a picture to lay it over the game view</div>
<script type="module">

const handsOf = (h, m) => { const H = (P.holds[h] ??= {}); const x = (H[m] ??= {}); x.R = fill(groupDefaults(GROUPS[1]), x.R); return x; };

let PARTS = {};
const attOf = gid => ((P.att ??= {})[gid] ??= { grip: '', gcm: null, optic: '', ocm: null, oy: 0 });
const fits = (id, gid) => !!(id && PARTS[id] && PARTS[id].mount.includes(gid));
const gripOn = gid => { const a = P.att && P.att[gid]; return a && fits(a.grip, gid) && GUNDATA[gid] ? PARTS[a.grip] : null; };

const gripHandOf = (id, m) => { const H = ((P.gripHand ??= {})[id] ??= {}); H[m] = fill(groupDefaults(GROUPS[2]), H[m]); return H[m]; };

// templates: a gun can follow another gun's pose, carried over by matching parts (see derive); his own edits detach it
const DEFAULT_FOLLOW = { AR57_PDW: 'AAC_Honey', American180: 'AAC_Honey', AssaultRifle2: 'AAC_Honey', BOAR: 'AAC_Honey', DSHK: 'AAC_Honey',
  L86: 'AAC_Honey', M2Carbine: 'AAC_Honey', M870_CQB: 'AAC_Honey', RPG_7: 'AAC_Honey', TenPointTurbo_XLT: 'AAC_Honey', Winchester1866: 'AAC_Honey',
  // wave 2 (Josiah 21:01): each new gun starts from the gun he already posed in its class
  Automag: 'Colt1911', G17: 'Colt1911', HK_USP: 'Colt1911', Colt1903: 'Colt1911', SW_327: 'SW_M500', Colt_Service38: 'SW_M500',
  CAR15SMG: 'AR57_PDW', MP7: 'AR57_PDW', UZI: 'AR57_PDW', AUG9: 'AR57_PDW',
  Bush_AR15_MOE: 'AAC_Honey', AK47: 'AAC_Honey', F2000: 'AAC_Honey', G36C: 'AAC_Honey', SCARL: 'AAC_Honey',

  Judge513_45LC: 'SW_M500', GP100_6: 'SW_M500', M29_44Carbine: 'Winchester1866', M1911_Carbine: 'AR57_PDW',
  Model55: 'AR57_PDW', Bizon2_01: 'AR57_PDW', EVO: 'AR57_PDW', KRISS: 'AR57_PDW', MAC10: 'AR57_PDW',

  AK12_New: 'AAC_Honey', AK308: 'AssaultRifle2', AN94: 'AAC_Honey', AR18: 'AAC_Honey', FAMAS: 'L86',
  Galil: 'AssaultRifle2', SKS: 'AAC_Honey', Vz58: 'AAC_Honey', AUG_A3: 'L86', L85A2: 'L86', MK47: 'AAC_Honey',
  ADAR: 'AAC_Honey', Bush_XM15: 'AAC_Honey', Bush_XM15_Custom: 'AAC_Honey', M4: 'AAC_Honey', G33: 'AAC_Honey',

  MAS49: 'AssaultRifle2', OTS_03_SVU: 'AssaultRifle2', M1903: 'BOAR', RPK16: 'L86', G21LMG: 'L86', M249E3: 'L86',
  RPD: 'L86', TXS_804_45LC: 'M870_CQB', Colt1855: 'M870_CQB', KS23_S: 'M870_CQB', M870_MCS: 'M870_CQB',
  M1208: 'M870_CQB', SPAS_15: 'M870_CQB', USAS_12: 'M870_CQB', CAWS: 'M870_CQB', TOZ106: 'M870_CQB',

const STORE = 'survivor-arms-tool-v1';

// - his Honey ADS 0.1 sideways only worked round the pack rear sight being off centre (now centred): back to 0.
const SIZE_LIFT = {"AAC_Honey":[0.0,22.7977],"AR57_PDW":[0.0,20.7913],"American180":[0.0,15.7181],"AssaultRifle2":[-1.3125,10.3632],"BOAR":[-2.625,23.2767],"Colt1911":[0.0,8.8627],"DSHK":[0.0,13.4031],"L86":[-0.4375,19.8625],"M2Carbine":[-1.0938,9.2364],"M870_CQB":[0.0,17.8006],"RPG_7":[0.0,20.304],"SW_M500":[0.0,8.4473],"TenPointTurbo_XLT":[0.0,19.047],"Winchester1866":[0.0,10.4562]};
function migrate() {
  if (P.fixes && P.fixes.f1103) return;
  const r1 = v => Math.round(v * 10) / 10;

const r4 = v => Math.round(v * 1e4) / 1e4;
function numbers(gid, m) {
  const M = poseBones(gid, m), G = gunMatrix(gid, m);
  const pos = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  G.decompose(pos, q, sc);
  const bones = {};
  const names = [...ARMS.bones, ...['R', 'L'].flatMap(sd => ['index', 'middle', 'ring', 'little'].map(f => `${sd}_Finger1_${f}`))];
  names.forEach((n, i) => { const p = new THREE.Vector3(), r = new THREE.Quaternion(), s = new THREE.Vector3(); M[i].decompose(p, r, s); bones[n] = { pos: p.toArray().map(r4), quat: r.toArray().map(r4) }; });
  const o = { gun: { gripPx: info(gid).grip, gripEye: pos.toArray().map(r4), quat: q.toArray().map(r4), scale: r4(sc.x) }, bonesEye: bones };
  if (m === 'ads') o.lens = sl(gid, m).gun.lens / 100;   // scope lens diameter, share of screen height
  const at = attNumbers(gid); if (at) o.att = at;
  return o;
}
// third person: her pose in her own frame (feet at 0, facing -z, x to her right), metres; the clip it starts from
function tpNumbers(gid, m) {
  if (!BODY || !GUNDATA[gid]) return null;
  const { M, G } = tpPose(gid, m), lift = new THREE.Matrix4().makeTranslation(0, 1.62, 0);
  const pos = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  G.clone().premultiply(lift).decompose(pos, q, sc);
  const bones = {};
  const names = [...BODY.bones, ...['R', 'L'].flatMap(sd => ['index', 'middle', 'ring', 'little'].map(f => `Bip01_${sd}_Finger1_${f}`))];
  names.forEach((n, i) => { if (!/Arm|Forearm|Hand|Finger|Clavicle/.test(n)) return; const p = new THREE.Vector3(), r = new THREE.Quaternion(), s = new THREE.Vector3(); M[i].clone().premultiply(lift).decompose(p, r, s); bones[n] = { pos: p.toArray().map(r4), quat: r.toArray().map(r4) }; });
  return { clip: clipOf(gid, m), gun: { gripPx: info(gid).grip, gripBody: pos.toArray().map(r4), quat: q.toArray().map(r4), scale: r4(sc.x) }, bonesBody: bones };
}
function allNumbers() {
  const o = { tool: 'survivor-arms-posing-tool v4', guns: {} };
  for (const g of IDX) {
    const old = prevNumbers && prevNumbers.guns && prevNumbers.guns[g.id];
    if (!GUNDATA[g.id]) { if (old) o.guns[g.id] = old; continue; }
    try { o.guns[g.id] = { hold: g.hold, hip: numbers(g.id, 'hip'), ads: numbers(g.id, 'ads') };
      for (const m of ['tpready', 'tpaim']) { const t = tpNumbers(g.id, m); if (t) o.guns[g.id][m] = t; } }
    catch (e) { if (old) o.guns[g.id] = old; else delete o.guns[g.id]; } }
  return o;
}
document.getElementById('copy').onclick = async () => {
  if (!ARMS || !lastPose) return;
  const text = JSON.stringify({ state: P, numbers: allNumbers() });
  out.value = text;
  try { await navigator.clipboard.writeText(text); document.getElementById('copy').textContent = 'Copied'; setTimeout(() => document.getElementById('copy').textContent = 'Copy numbers', 1500); }
  catch (e) { out.select(); }
};

// ------------------------------------------------------------------ picture overlay, views, start
const ov = document.getElementById('overlay');
const showPic = f => { ov.src = URL.createObjectURL(f); ov.style.display = 'block'; ov.style.opacity = document.getElementById('overlayop').value; };
document.getElementById('overlayfile').onchange = e => { const f = e.target.files[0]; if (f) showPic(f); };
document.getElementById('overlayop').oninput = e => ov.style.opacity = e.target.value;
const drop = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; });
addEventListener('dragleave', e => { if (e.target === drop) drop.style.display = 'none'; });
addEventListener('drop', e => { e.preventDefault(); drop.style.display = 'none'; const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) showPic(f); });
document.querySelectorAll('.vtoggle button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.vtoggle button').forEach(x => x.classList.toggle('on', x === b));
  views.forEach((v, i) => v.classList.toggle('mhide', i !== +b.dataset.v));
  resize();
});
const pick = document.getElementById('gunpick');
pick.onchange = () => showGun(pick.value);
const failed = () => { document.querySelector('#start h2').textContent = 'The arm and gun data did not load. Reload the page to try again.'; };
Promise.all(['arms.json', 'holds.json', 'guns/index.json'].map(u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); }))
    .concat(fetch('parts/index.json').then(r => r.ok ? r.json() : []).catch(() => [])))
  .then(async ([arms, holds, idx, parts]) => {
    ARMS = arms; HOLDKITS = holds; IDX = idx; PARTS = Object.fromEntries(parts.map(p => [p.id, p]));
    // parts that are gone (Brita sights; his first pack's sights and grips and the Brita bipod, Josiah 08:46) come off the guns
    for (const a of Object.values(P.att || {})) if (a) { if (a.optic && !PARTS[a.optic]) { a.optic = ''; a.oy = 0; } if (a.grip && !PARTS[a.grip]) a.grip = ''; }
    buildAttPanel();
    for (const h of Object.keys(HOLDS)) {
      const gs = IDX.filter(g => g.hold === h); if (!gs.length) continue;
      const og = document.createElement('optgroup'); og.label = HOLDS[h];
      for (const g of gs) { const o = document.createElement('option'); o.value = g.id; o.textContent = g.name; og.appendChild(o); }
      pick.appendChild(og);
    }
    buildArms();
    document.getElementById('start').style.display = 'none';
    document.getElementById('app').style.display = '';
    resize();
    setFov(P.fov || 70);
    if (TP(P.mode)) await loadBody().catch(() => { P.mode = 'hip'; }); else loadBody().catch(() => {});
    await showGun(P.gun);
    setSide(TP(P.mode) ? 'front' : 'left');
    connectCloud(); cloudTried = true;     // the online save first (Josiah 18:56: a slow load of 41 guns hid his poses)
    for (const g of IDX) await gunData(g.id).catch(() => {});
  })
  .catch(failed)
  .finally(() => { if (!cloudTried) connectCloud(); });
</script>
