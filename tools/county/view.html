<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script>
// County preview without dependencies: draws tools/city/mesh.py output with plain WebGL2 under the
// mod's overcast daylight (sky light from above, a weak sun with soft shadows, haze).
//   view.html?mesh=DIR&cam=x,y,z,lookx,looky,lookz[,fov]&w=1440&h=1080[&fog=0.006][&sun=0.35]
// &dark=1 shows a place underground or at night as the player sees it: next to no ambient light,
// the lamps that are on and a torch held at the eye (&torch=0 for none). Meshes with baked block
// light (mesh.json "baked") are lit by it, Minecraft style, so walls stop light as in the game;
// older meshes fall back to the nearest lamps as point lights.
// &photon=1 is a mock-up of the game under the Photon shader pack with Josiah's settings: HDR light,
// the LabPBR normal and specular maps, a blue sky with clouds, sky light only where the sky is seen,
// lamps that light by direction (Photonics), bloom and bloomy fog, auto exposure (bias -0.3),
// Purkinje in the dark, saturation 0.8 and contrast 1.1. It renders at &ss=2 times the size and
// scales down. &hand=1 adds a held torch; &ev=N shifts the exposure by N stops. &rain=1 is his
// permanent rain: a low grey overcast instead of the sun, wet ground (darker, with puddle shine on
// whatever faces the sky), grey fog and faint streaks.
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1440), H = +(P.get('h') || 1080);
const DIR = P.get('mesh') || 'mesh';
const cam = (P.get('cam') || '0,40,60,0,20,0,60').split(',').map(Number);
const FOV = cam[6] || 60;
const FOG = +(P.get('fog') || 0.0045);
const SUN = +(P.get('sun') || 0.55);
const DARK = P.get('dark') === '1';
const AMB = +(P.get('amb') || 0.04), TORCH = DARK && P.get('torch') !== '0';
const SKY = DARK ? [0.01, 0.01, 0.012] : [0.50, 0.53, 0.56], HAZE = DARK ? [0.004, 0.004, 0.005] : [0.47, 0.50, 0.52];
const NL = 24;
const PHOTON = P.get('photon') === '1', SS = PHOTON ? +(P.get('ss') || 2) : 1, NLP = 48;
const HAND = P.get('hand') === '1', EV = +(P.get('ev') || 0), RAIN = P.get('rain') === '1';
// Photon (Colored Lights on) colours a froglight's light by its block: lavender-pink, green, amber
const FROG = {pearlescent_froglight: [0.95, 0.55, 1.0], verdant_froglight: [0.45, 1.0, 0.5], ochre_froglight: [1.0, 0.72, 0.32]};

const cv = document.createElement('canvas');
cv.width = W; cv.height = H;
document.body.appendChild(cv);
const gl = cv.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true });
const aniso = gl.getExtension('EXT_texture_filter_anisotropic');

// ---------------------------------------------------------------- maths
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(...a); return a.map((v) => v / l); };
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function lookAt(eye, at, up = [0, 1, 0]) {
  const f = norm(sub(at, eye)), s = norm(cross(f, up)), u = cross(s, f);
  return [s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0, -dot(s, eye), -dot(u, eye), dot(f, eye), 1];
}
function persp(fov, aspect, n, f) {
  const t = 1 / Math.tan(fov * Math.PI / 360);
  return [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) / (n - f), -1, 0, 0, 2 * f * n / (n - f), 0];
}
function ortho(r, n, f) {
  return [1 / r, 0, 0, 0, 0, 1 / r, 0, 0, 0, 0, -2 / (f - n), 0, 0, 0, -(f + n) / (f - n), 1];
}
function mul(a, b) {  // column-major a*b
  const o = new Array(16).fill(0);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k];
  return o;
}

// ---------------------------------------------------------------- shaders
function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, '#version 300 es\nprecision highp float;\n' + src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.bindAttribLocation(p, 0, 'pos'); gl.bindAttribLocation(p, 1, 'nrm');
  gl.bindAttribLocation(p, 2, 'uv'); gl.bindAttribLocation(p, 3, 'ao');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
const MAIN = program(`
  in vec3 pos; in vec3 nrm; in vec2 uv; in vec4 ao;
  uniform mat4 view, proj, sunMat; uniform float unit, uvScale;
  out vec3 vW; out vec3 vN; out vec2 vUV; out float vAO; out vec3 vBL; out vec4 vSun;
  void main() {
    vec3 w = pos / unit;
    // face UVs count up from the bottom; images load top row first
    vW = w; vN = nrm; vUV = vec2(uv.x / uvScale, 16.0 - uv.y / uvScale) / 16.0; vAO = ao.r; vBL = ao.gba;
    vSun = sunMat * vec4(w + nrm * 0.06, 1.0);
    gl_Position = proj * view * vec4(w, 1.0);
  }`, `
  in vec3 vW; in vec3 vN; in vec2 vUV; in float vAO; in vec3 vBL; in vec4 vSun;
  uniform sampler2D tex; uniform highp sampler2DShadow shadow; uniform sampler2D emis;
  uniform vec3 eye, sunDir, sky, haze; uniform float fogD, sunI, cutout, glow;
  uniform int dark; uniform int baked; uniform float amb; uniform vec3 tPos, tDir; uniform int torch, blend;
  uniform vec4 lPos[24]; uniform vec3 lCol[24]; uniform int nl;
  out vec4 col;
  void main() {
    vec4 t = texture(tex, vUV);
    if (t.a < cutout) discard;
    vec3 n = normalize(vN);
    if (!gl_FrontFacing) n = -n;
    vec3 alb = pow(t.rgb, vec3(2.2));
    // overcast: most light comes from the whole sky; sides get less, undersides bounce light
    float skyL = mix(0.42, 1.0, n.y * 0.5 + 0.5);
    vec3 p = vSun.xyz / vSun.w * 0.5 + 0.5;
    float lit = 0.0;
    for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++)
      lit += texture(shadow, vec3(p.xy + vec2(i, j) / 4096.0 * 1.5, p.z - 0.0008));
    lit /= 9.0;
    if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0) lit = 1.0;
    float sunL = max(dot(n, sunDir), 0.0) * lit * sunI;
    vec3 light = vec3(0.80, 0.84, 0.88) * skyL * (0.55 + 0.45 * vAO) + vec3(1.0, 0.96, 0.88) * sunL * (0.6 + 0.4 * vAO);
    vec3 c = alb * light * 1.15;
    if (dark == 1) {
      // underground: a trace of ambient, the lamps that are on, the torch in your hand
      vec3 L = vec3(amb) * (0.6 + 0.4 * vAO);
      if (baked == 1) {
        // Minecraft's light curve: level 15 full, falling away fast towards the dark
        vec3 b = vBL / (4.0 - 3.0 * vBL) * (0.7 + 0.3 * vAO) * 2.2;
        L += vec3(1.0, 0.86, 0.66) * b.x + vec3(1.0, 0.10, 0.05) * b.y + vec3(0.30, 1.0, 0.35) * b.z;
      }
      for (int i = 0; i < 24; i++) {
        if (i >= nl) break;
        vec3 v = lPos[i].xyz - vW; float dl = length(v); float r = lPos[i].w;
        float a = 1.0 / (1.0 + 0.6 * dl * dl) * smoothstep(r, r * 0.4, dl);
        L += lCol[i] * a * (0.25 + 0.75 * max(dot(n, v / max(dl, 0.001)), 0.0)) * 6.0;
      }
      if (torch == 1) {
        vec3 v = tPos - vW; float dt = length(v); vec3 l = v / max(dt, 0.001);
        float cone = smoothstep(0.80, 0.96, dot(-l, tDir));
        L += vec3(1.0, 0.93, 0.80) * cone * max(dot(n, l), 0.0) * 9.0 / (1.0 + 0.09 * dt * dt);
      }
      c = alb * L + pow(texture(emis, vUV).rgb, vec3(2.2)) * glow * 2.5;
      c = c / (1.0 + c * 0.6);
    }
    float d = length(vW - eye);
    float f = 1.0 - exp(-pow(d * fogD, 2.0));
    c = mix(c, pow(haze, vec3(2.2)), f);
    col = vec4(pow(c, vec3(1.0 / 2.2)), blend == 1 ? t.a : 1.0);
  }`);
const DEPTH = program(`
  in vec3 pos; in vec2 uv; uniform mat4 sunMat; uniform float unit, uvScale; out vec2 vUV;
  void main() { vUV = vec2(uv.x / uvScale, 16.0 - uv.y / uvScale) / 16.0; gl_Position = sunMat * vec4(pos / unit, 1.0); }`, `
  in vec2 vUV; uniform sampler2D tex; uniform float cutout; out vec4 col;
  void main() { if (texture(tex, vUV).a < cutout) discard; col = vec4(1.0); }`);
const SKYP = program(`
  in vec3 pos; out vec2 v; void main() { v = pos.xy; gl_Position = vec4(pos.xy, 0.9999, 1.0); }`, `
  in vec2 v; uniform vec3 sky, haze; out vec4 col;
  void main() { col = vec4(mix(haze, sky * 0.9, smoothstep(-0.2, 1.0, v.y)), 1.0); }`);

// ---------------------------------------------------------------- the Photon mock-up
// Scene pass: linear HDR colour, distance from the eye in alpha (for fog).
const PH_SCENE = PHOTON && program(`
  in vec3 pos; in vec3 nrm; in vec2 uv; in vec4 ao;
  uniform mat4 view, proj, sunMat, skyMat; uniform float unit, uvScale;
  out vec3 vW; out vec3 vN; out vec2 vUV; out float vAO; out vec3 vBL; out vec4 vSun; out vec4 vSky;
  void main() {
    vec3 w = pos / unit;
    vW = w; vN = nrm; vUV = vec2(uv.x / uvScale, 16.0 - uv.y / uvScale) / 16.0; vAO = ao.r; vBL = ao.gba;
    vSun = sunMat * vec4(w + nrm * 0.06, 1.0);
    vSky = skyMat * vec4(w + nrm * 0.5, 1.0);
    gl_Position = proj * view * vec4(w, 1.0);
  }`, `
  in vec3 vW; in vec3 vN; in vec2 vUV; in float vAO; in vec3 vBL; in vec4 vSun; in vec4 vSky;
  uniform sampler2D tex, nmap, orm, emis; uniform highp sampler2DShadow shadow, skyShadow;
  uniform vec3 eye, sunDir, sunCol, warm; uniform float cutout, glow, hasN, skyTexel;
  uniform int dark, hand, rain, blend; uniform vec3 tPos;
  uniform vec4 lPos[${NLP}]; uniform vec3 lCol[${NLP}]; uniform int nl;
  out vec4 col;
  const float PI = 3.14159265;
  vec3 ggx(vec3 n, vec3 v, vec3 l, float rough, vec3 f0) {
    vec3 h = normalize(v + l);
    float NoL = max(dot(n, l), 0.0), NoV = max(dot(n, v), 1e-3), NoH = max(dot(n, h), 0.0), VoH = max(dot(v, h), 0.0);
    float a = max(rough, 0.04), a2 = a * a, d = NoH * NoH * (a2 - 1.0) + 1.0;
    float k = a * 0.5, G = 1.0 / ((NoL * (1.0 - k) + k) * (NoV * (1.0 - k) + k));
    vec3 F = f0 + (1.0 - f0) * pow(1.0 - VoH, 5.0);
    return a2 / (PI * d * d) * G * F * 0.25 * NoL;
  }
  // Photon's block light: bright at the lamp and fading smoothly to nothing where the level runs out
  float fall(float lv) { return pow(max(lv, 0.0), 2.5) * smoothstep(0.0, 0.1, lv); }
  void main() {
    vec4 t = texture(tex, vUV);
    if (t.a < cutout) discard;
    vec3 ng = normalize(vN);
    if (!gl_FrontFacing) ng = -ng;
    vec3 n = ng;
    if (hasN > 0.5) {
      vec3 dp1 = dFdx(vW), dp2 = dFdy(vW); vec2 du1 = dFdx(vUV), du2 = dFdy(vUV);
      vec3 a1 = cross(dp2, ng), a2 = cross(ng, dp1);
      vec3 T = a1 * du1.x + a2 * du2.x, B = a1 * du1.y + a2 * du2.y;
      float m = max(dot(T, T), dot(B, B));
      if (m > 0.0) {
        float s = inversesqrt(m);
        vec3 tn = texture(nmap, vUV).xyz * 2.0 - 1.0;
        // images load top row first, so the map's +y (up the picture) is -v here
        vec3 nn = normalize(T * s * tn.x - B * s * tn.y + ng * tn.z);
        if (dot(nn, ng) > 0.1) n = nn;
      }
    }
    vec3 o = texture(orm, vUV).rgb;
    float rough = clamp(o.g, 0.05, 1.0), metal = o.b;
    vec3 alb = pow(t.rgb, vec3(2.2));
    vec3 v = normalize(eye - vW);
    float ao = (0.35 + 0.65 * vAO) * mix(1.0, o.r, 0.7);
    vec3 c = vec3(0.0);
    // sky light only where the sky can be seen from (a wide soft look straight up)
    float sv = 0.0;
    if (dark == 0) {
      vec3 q = vSky.xyz / vSky.w * 0.5 + 0.5;
      for (int i = -3; i <= 3; i++) for (int j = -3; j <= 3; j++)
        sv += texture(skyShadow, vec3(q.xy + vec2(i, j) * skyTexel, q.z - 0.002));
      sv /= 49.0;
      if (q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) sv = 1.0;
    }
    if (rain == 1 && dark == 0) {
      // rained on: darker where wet, and what faces the sky holds a film of water that shines
      float wet = sv * (0.4 + 0.6 * smoothstep(0.2, 0.95, ng.y)), pool = sv * smoothstep(0.6, 0.98, ng.y);
      alb *= mix(1.0, 0.6, wet);
      rough = mix(rough * mix(1.0, 0.6, wet), 0.08, pool * 0.6);
      n = normalize(mix(n, ng, pool * 0.6));
    }
    vec3 f0 = mix(vec3(0.04), alb, metal), dif = alb * (1.0 - metal) / PI;
    if (dark == 0) {
      vec3 p = vSun.xyz / vSun.w * 0.5 + 0.5;
      float lit = 0.0;
      for (int i = -2; i <= 2; i++) for (int j = -2; j <= 2; j++)
        lit += texture(shadow, vec3(p.xy + vec2(i, j) / 4096.0, p.z - 0.0006));
      lit /= 25.0;
      if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0) lit = 1.0;
      lit *= step(0.0, dot(ng, sunDir));
      c += (dif * max(dot(n, sunDir), 0.0) * PI + ggx(n, v, sunDir, rough, f0) * PI) * sunCol * lit * (rain == 1 ? 0.06 : 1.0);
      vec3 skyIrr = rain == 1 ? mix(vec3(0.16, 0.17, 0.18), vec3(0.47, 0.49, 0.52) * 1.6, n.y * 0.5 + 0.5)
                              : mix(vec3(0.30, 0.29, 0.27), vec3(0.62, 0.74, 1.0) * 1.35, n.y * 0.5 + 0.5);
      c += alb * (1.0 - metal) * skyIrr * ao * (0.06 + 0.94 * sv);
      vec3 r = reflect(-v, n);
      float fr = pow(1.0 - max(dot(n, v), 0.0), 5.0);
      vec3 skyRef = rain == 1 ? mix(vec3(0.12), vec3(0.47, 0.49, 0.52) * 0.9, clamp(r.y * 0.5 + 0.5, 0.0, 1.0))
                              : mix(vec3(0.3), vec3(0.62, 0.74, 1.0) * 1.6, clamp(r.y * 0.5 + 0.5, 0.0, 1.0));

    vec3 bc = warm * fall(vBL.x) + vec3(1.0, 0.10, 0.05) * fall(vBL.y) + vec3(0.30, 1.0, 0.35) * fall(vBL.z);
    float bake = fall(vBL.x) + fall(vBL.y) + fall(vBL.z);
    vec3 dirL = vec3(0.0), spL = vec3(0.0); float free = 0.0;

      float w = fall((lPos[i].w - dl) / 15.0);

    float known = free > 1e-5 ? clamp(free / max(bake, 1e-5), 0.0, 1.0) : 0.0;

    lamp += bc * alb * 0.12 * ao;   // light bounced off the walls
    c += lamp * 8.0;

      vec3 lv = tPos - vW; float dl = length(lv); vec3 l = lv / max(dl, 1e-3);
      float w = fall((14.0 - dl) / 15.0);
      c += (dif * max(dot(n, l), 0.0) * PI + ggx(n, v, l, rough, f0) * PI) * warm * w * 8.0;
    }
    c += pow(texture(emis, vUV).rgb, vec3(2.2)) * glow * (dark == 1 ? 30.0 : 12.0);
    // a blended part (glass, water) hands its alpha to the blend; the distance under it stays

  }`);
const PH_QUAD_VS = `in vec3 pos; out vec2 v; void main() { v = pos.xy * 0.5 + 0.5; gl_Position = vec4(pos.xy, 0.9999, 1.0); }`;
// Photon's sky: deep blue overhead, pale at the horizon, a glow round the sun, a layer of cumulus
const PH_SKY = PHOTON && program(PH_QUAD_VS, `
  in vec2 v; uniform mat4 invVP; uniform vec3 eye, sunDir; uniform int dark, rain; out vec4 col;
  float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float nz(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
  float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 6; i++) { s += a * nz(p); p = p * 2.03 + 17.0; a *= 0.5; } return s; }
  void main() {
    if (dark == 1) { col = vec4(0.0, 0.0, 0.0, 3000.0); return; }

    vec3 d = normalize(a.xyz / a.w - eye);
    if (rain == 1) {
      // one low deck of rain cloud, darker in its folds, lighter towards the horizon
      vec3 lo = vec3(0.27, 0.29, 0.31), hi = vec3(0.47, 0.49, 0.52);

        float cl = fbm(cp * 0.004) * 0.7 + fbm(cp * 0.017) * 0.3;
        c = mix(hi, lo, smoothstep(0.3, 0.7, cl) * smoothstep(0.0, 0.25, d.y));

    if (d.y > 0.0) {

      float cl = fbm(cp * 0.0035);
      float cov = smoothstep(0.50, 0.72, cl) * smoothstep(0.0, 0.12, d.y);
      float sh = fbm(cp * 0.0035 + sunDir.xz * 0.12);
      vec3 cc = mix(vec3(0.46, 0.50, 0.58) * 1.3, vec3(1.0, 0.97, 0.92) * 2.6, smoothstep(0.72, 0.48, sh));
      c = mix(c, cc + vec3(1.0, 0.9, 0.75) * pow(mu, 6.0), cov * 0.92);
    } else c = mix(hor, vec3(0.32, 0.33, 0.35), min(-d.y * 5.0, 1.0));

// 13-tap downsample and tent upsample for bloom
const PH_DOWN = PHOTON && program(PH_QUAD_VS, `
  in vec2 v; uniform sampler2D src; uniform vec2 px; out vec4 col;
  vec3 s(vec2 o) { return min(texture(src, v + o * px).rgb, vec3(400.0)); }
  void main() {
    vec3 c = s(vec2(0)) * 0.125;
    c += (s(vec2(-1, -1)) + s(vec2(1, -1)) + s(vec2(-1, 1)) + s(vec2(1, 1))) * 0.125;
    c += (s(vec2(-2, -2)) + s(vec2(2, -2)) + s(vec2(-2, 2)) + s(vec2(2, 2))) * 0.03125;
    c += (s(vec2(0, -2)) + s(vec2(0, 2)) + s(vec2(-2, 0)) + s(vec2(2, 0))) * 0.0625;

  }`);
const PH_UP = PHOTON && program(PH_QUAD_VS, `
  in vec2 v; uniform sampler2D low, here; uniform vec2 px; out vec4 col;
  void main() {
    vec3 c = texture(low, v).rgb * 4.0;
    c += (texture(low, v + vec2(px.x, 0)).rgb + texture(low, v - vec2(px.x, 0)).rgb + texture(low, v + vec2(0, px.y)).rgb + texture(low, v - vec2(0, px.y)).rgb) * 2.0;
    c += texture(low, v + px).rgb + texture(low, v - px).rgb + texture(low, v + vec2(px.x, -px.y)).rgb + texture(low, v - vec2(px.x, -px.y)).rgb;
    col = vec4(texture(here, v).rgb + c / 16.0, 1.0);

// fog, bloom, exposure, Purkinje, tone map and Josiah's grade
const PH_POST = PHOTON && program(PH_QUAD_VS, `
  in vec2 v; uniform sampler2D scene, bloom, wide; uniform float exposure, bloomK, fogK, nb, nw;
  uniform vec3 fogCol, sunDir, eye; uniform mat4 invVP; uniform int dark, rain; uniform vec2 res; out vec4 col;
  float h1(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
  void main() {
    vec4 s = texture(scene, v); vec3 c = s.rgb; float d = s.a;
    vec3 b = texture(bloom, v).rgb / nb, bw = texture(wide, v).rgb / nw;
    float f = 1.0 - exp(-d * fogK);
    if (dark == 0) {
      vec4 a = invVP * vec4(v * 2.0 - 1.0, 1.0, 1.0);
      vec3 dir = normalize(a.xyz / a.w - eye);
      vec3 fc = fogCol + (rain == 1 ? vec3(0.0) : vec3(1.0, 0.85, 0.65) * pow(max(dot(dir, sunDir), 0.0), 8.0) * 1.2);
      if (d < 2000.0) c = mix(c, fc, f);
      if (rain == 1) {
        // falling rain: short slanted streaks, a little brighter than what's behind them
        vec2 px = v * res; px.x += px.y * 0.16;
        float lane = floor(px.x / 2.0), len = res.y * 0.06;
        float seg = floor(px.y / len + h1(vec2(lane, 3.0)) * 9.0);
        float on = step(0.985, h1(vec2(lane, seg))) * smoothstep(0.0, 0.6, fract(px.y / len + h1(vec2(lane, 3.0)) * 9.0));
        c += fogCol * on * 0.07;
      }
    } else {
      c = mix(c, bw * 1.3, f);   // bloomy fog: the haze glows round the lamps
    }
    c = mix(c, b, bloomK);
    c *= exposure;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    float rod = dot(c, vec3(0.06, 0.56, 0.38));
    c = mix(c, rod * vec3(0.60, 0.82, 1.15), 0.6 * (1.0 - smoothstep(0.0, 0.08, l)));
    c = aces(c);
    float y = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c = mix(vec3(y), c, 0.8);
    c = pow(c, vec3(1.0 / 2.2));
    c = (c - 0.45) * 1.10 + 0.45;
    vec2 q = v - 0.5;
    c *= 1.0 - 0.55 * dot(q, q);
    c += (fract(sin(dot(v * res, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
    col = vec4(clamp(c, 0.0, 1.0), 1.0);
  }`);

// ---------------------------------------------------------------- loading
function loadTex(url) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST_MIPMAP_LINEAR);
      if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, 8);
      res(t);
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}

function invert(m) {  // 4x4 inverse, column-major
  const [a00, a01, a02, a03, a10, a11, a12, a13, a20, a21, a22, a23, a30, a31, a32, a33] = m;
  const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11;
  const b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12, b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30;
  const b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
  const d = 1 / (b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06);
  return [(a11 * b11 - a12 * b10 + a13 * b09) * d, (a02 * b10 - a01 * b11 - a03 * b09) * d, (a31 * b05 - a32 * b04 + a33 * b03) * d, (a22 * b04 - a21 * b05 - a23 * b03) * d,
    (a12 * b08 - a10 * b11 - a13 * b07) * d, (a00 * b11 - a02 * b08 + a03 * b07) * d, (a32 * b02 - a30 * b05 - a33 * b01) * d, (a20 * b05 - a22 * b02 + a23 * b01) * d,
    (a10 * b10 - a11 * b08 + a13 * b06) * d, (a01 * b08 - a00 * b10 - a03 * b06) * d, (a30 * b04 - a31 * b02 + a33 * b00) * d, (a21 * b02 - a20 * b04 - a23 * b00) * d,
    (a11 * b07 - a10 * b09 - a12 * b06) * d, (a00 * b09 - a01 * b07 + a02 * b06) * d, (a31 * b01 - a30 * b03 - a32 * b00) * d, (a20 * b03 - a21 * b01 + a22 * b00) * d];
}

// HDR render target, optionally with a depth buffer
function target(w, h, depth) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  if (depth) {
    const rb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
  }
  return { t, f, w, h };
}

function photon({ parts, index, eye, view, proj, fwd, centre, sunDir, sunMat, depthTex, depthMap }) {
  if (!gl.getExtension('EXT_color_buffer_float')) console.error('no float render targets');
  const SW = W * SS, SH = H * SS, unit = index.unit || 16, R = +(P.get('shadow') || 140);
  // sky visibility: the scene's depth seen from (nearly) straight above, sampled wide and soft
  const skyMat = mul(ortho(R, 1, 900), lookAt([centre[0], centre[1] + 400, centre[2]], centre, [0, 0, 1]));
  const skyTex = DARK ? depthTex : depthMap(skyMat, 2048);
  const invVP = invert(mul(proj, view));
  const warm = [1.0, 0.80, 0.55];   // his Photon blocklight colour

  const quad = gl.createVertexArray();
  gl.bindVertexArray(quad);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const full = () => { gl.bindVertexArray(quad); gl.drawArrays(gl.TRIANGLES, 0, 3); };

  // sky, then the scene, into linear HDR
  const scene = target(SW, SH, true);
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.f);
  gl.viewport(0, 0, SW, SH);
  gl.clearColor(0, 0, 0, 3000);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(PH_SKY);
  gl.uniformMatrix4fv(gl.getUniformLocation(PH_SKY, 'invVP'), false, invVP);
  gl.uniform3fv(gl.getUniformLocation(PH_SKY, 'eye'), eye);
  gl.uniform3fv(gl.getUniformLocation(PH_SKY, 'sunDir'), sunDir);
  gl.uniform1i(gl.getUniformLocation(PH_SKY, 'dark'), DARK ? 1 : 0);
  gl.uniform1i(gl.getUniformLocation(PH_SKY, 'rain'), RAIN ? 1 : 0);
  gl.depthMask(false); full(); gl.depthMask(true);

  gl.useProgram(PH_SCENE);
  const u = (n) => gl.getUniformLocation(PH_SCENE, n);
  // glass and water: drawn after everything else, blended over it, not hiding what's behind them
  const setBlend = (on) => {
    gl.uniform1i(u('blend'), on ? 1 : 0);
    if (on) { gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE); gl.depthMask(false); }
    else { gl.disable(gl.BLEND); gl.depthMask(true); }

  gl.uniformMatrix4fv(u('view'), false, view); gl.uniformMatrix4fv(u('proj'), false, proj);
  gl.uniformMatrix4fv(u('sunMat'), false, sunMat); gl.uniformMatrix4fv(u('skyMat'), false, skyMat);
  gl.uniform1f(u('unit'), unit); gl.uniform3fv(u('eye'), eye); gl.uniform3fv(u('sunDir'), sunDir);
  gl.uniform3fv(u('sunCol'), [0.86 * 2.6, 0.90 * 2.6, 1.0 * 2.6]); gl.uniform3fv(u('warm'), warm);
  gl.uniform1f(u('skyTexel'), 0.6 / (2 * R));   // 0.6 blocks between taps
  gl.uniform1i(u('dark'), DARK ? 1 : 0); gl.uniform1i(u('hand'), HAND ? 1 : 0); gl.uniform1i(u('rain'), RAIN ? 1 : 0);
  const right = norm(cross(fwd, [0, 1, 0]));
  gl.uniform3fv(u('tPos'), [eye[0] + right[0] * 0.4, eye[1] - 0.4, eye[2] + right[2] * 0.4]);
  const lamps = (index.lights || []).map(([x, y, z, name]) => [x + 0.5, y + 0.5, z + 0.5, name])
    .sort((a, b) => Math.hypot(a[0] - eye[0], a[1] - eye[1], a[2] - eye[2]) - Math.hypot(b[0] - eye[0], b[1] - eye[1], b[2] - eye[2]))
    .slice(0, NLP);
  const lp = new Float32Array(NLP * 4), lc = new Float32Array(NLP * 3);
  lamps.forEach(([x, y, z, name, level], i) => {
    const red = name.includes('red'), stick = name.includes('glowstick'), frog = FROG[name.replace('minecraft:', '')];

  gl.bindTexture(gl.TEXTURE_2D, flat);

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, depthTex);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, skyTex);

    if (!p.tex) continue;
    setBlend(p.blend);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, p.emis || black);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, p.nmap || black);
    gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, p.orm || flat);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, p.tex);
    gl.uniform1f(u('glow'), p.emis ? 1.0 : 0.0); gl.uniform1f(u('hasN'), p.nmap ? 1.0 : 0.0);

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, low.t);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, down[i].t);
    gl.uniform2fv(gl.getUniformLocation(PH_UP, 'px'), [1 / low.w, 1 / low.h]);

  const E = down[4], buf = new Float32Array(E.w * E.h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, E.f);

  for (let y = 0; y < E.h; y++) for (let x = 0; x < E.w; x++) {

    const wt = Math.exp(-((x / E.w - 0.5) ** 2 + (y / E.h - 0.5) ** 2) * 6);

  }

  // and in the rain it keeps the day dim and grey
  const exposure = Math.min(Math.max((DARK ? 0.09 : RAIN ? 0.12 : 0.18) / avg, 0.05), DARK ? 4 : RAIN ? 1.25 : 3) * 2 ** (-0.3 + EV);
  console.warn('photon: average', avg.toFixed(4), 'exposure', exposure.toFixed(3));

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(PH_POST);
  const q = (n) => gl.getUniformLocation(PH_POST, n);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.t);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, up[0].t);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, up[3].t);
  gl.uniform1i(q('scene'), 0); gl.uniform1i(q('bloom'), 1); gl.uniform1i(q('wide'), 2);
  gl.uniform1f(q('nb'), down.length); gl.uniform1f(q('nw'), down.length - 3);
  gl.uniform1f(q('exposure'), exposure); gl.uniform1f(q('bloomK'), +(P.get('bloom') || 0.08));
  gl.uniform1f(q('fogK'), +(P.get('pfog') || (DARK ? 0.03 : RAIN ? 0.0055 : 0.004)));
  gl.uniform3fv(q('fogCol'), RAIN ? [0.40, 0.42, 0.45] : [0.62, 0.72, 0.86]); gl.uniform1i(q('rain'), RAIN ? 1 : 0); gl.uniform3fv(q('sunDir'), sunDir); gl.uniform3fv(q('eye'), eye);
  gl.uniformMatrix4fv(q('invVP'), false, invVP);
  gl.uniform1i(q('dark'), DARK ? 1 : 0); gl.uniform2fv(q('res'), [W, H]);
  full();
}

  gl.uniformMatrix4fv(u('sunMat'), false, sunMat); gl.uniform1f(u('unit'), index.unit || 16);
  gl.uniform3fv(u('eye'), eye); gl.uniform3fv(u('sunDir'), sunDir);
  gl.uniform3fv(u('sky'), SKY); gl.uniform3fv(u('haze'), HAZE);
  gl.uniform1f(u('fogD'), FOG); gl.uniform1f(u('sunI'), SUN);
  gl.uniform1i(u('tex'), 0); gl.uniform1i(u('shadow'), 1); gl.uniform1i(u('emis'), 2);
  gl.uniform1i(u('dark'), DARK ? 1 : 0); gl.uniform1f(u('amb'), AMB); gl.uniform1i(u('torch'), TORCH ? 1 : 0);
  // the torch: held low and to the right, pointing where you look
  const right = norm(cross(fwd, [0, 1, 0]));
  gl.uniform3fv(u('tPos'), [eye[0] + right[0] * 0.3, eye[1] - 0.3, eye[2] + right[2] * 0.3]);
  gl.uniform3fv(u('tDir'), fwd);
  // the nearest lamps that are on
  const lamps = (index.lights || []).map(([x, y, z, name]) => [x + 0.5, y + 0.5, z + 0.5, name])
    .sort((a, b) => Math.hypot(a[0] - eye[0], a[1] - eye[1], a[2] - eye[2]) - Math.hypot(b[0] - eye[0], b[1] - eye[1], b[2] - eye[2]))
    .slice(0, NL);
  const lp = new Float32Array(NL * 4), lc = new Float32Array(NL * 3);
  lamps.forEach(([x, y, z, name], i) => {
    const red = name.includes('red'), stick = name.includes('glowstick'), frog = FROG[name.replace('minecraft:', '')];
    lp.set([x, y, z, red ? 7 : stick ? 5 : 11], i * 4);
    lc.set(frog || (red ? [1.0, 0.10, 0.06] : stick ? [0.25, 1.0, 0.4] : [1.0, 0.82, 0.55]), i * 3);
  });
  gl.uniform4fv(u('lPos'), lp); gl.uniform3fv(u('lCol'), lc); gl.uniform1i(u('nl'), index.baked ? 0 : lamps.length);
  gl.uniform1i(u('baked'), index.baked ? 1 : 0);
  const black = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, black);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, depthTex);
  gl.activeTexture(gl.TEXTURE0);
  for (const p of [...parts.filter((q) => !q.blend), ...parts.filter((q) => q.blend)]) {
    if (!p.tex) continue;
    setBlend(p.blend);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, p.emis || black);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, p.tex);
    gl.uniform1f(u('glow'), p.emis ? 1.0 : 0.0); gl.uniform1f(u('uvScale'), p.uvScale);
    gl.uniform1f(u('cutout'), p.cutout);
    gl.bindVertexArray(p.vao);
    gl.drawElements(gl.TRIANGLES, p.count, gl.UNSIGNED_INT, 0);
  }
  setBlend(false);
  gl.finish();
  window.DONE = true;
})();
