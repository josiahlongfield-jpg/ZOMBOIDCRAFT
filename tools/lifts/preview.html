scene.add(new THREE.AmbientLight(0xbfc6d0, 0.55));
if (SHOT === 'landing' || SHOT === 'opening') {
  const open = SHOT === 'opening';
  lobby(0, { open });
  shaftWalls(1, 4);
  car({ w: 2, d: 3, car: 1, n: 14, called: open ? [] : [6], doors: open ? 0.55 : 0, ropeTop: 9, label: open ? '1' : '7', dir: open ? 0 : -1,
    pitch: 4, indicators: [1], landingOpen: open ? 1 : null });
  if (!open) {
    // hide the car (it is up at floor 7): draw only the landing's indicator
  }
  lamp(1, 3.6, -4); lamp(-3, 3.6, -6, 0.8); lamp(1, 3.5, 1.5, open ? 1.4 : 0, 4, 0xfff4e0);
  cam.position.set(open ? 0.4 : -1.2, 1.62 + 1, open ? -4.4 : -5.2); cam.lookAt(open ? 1 : 1.3, 2.0, 0);
} else if (SHOT === 'inside') {
  lobby(0, { open: true });
  shaftWalls(1, 4);
  car({ w: 2, d: 3, car: 1, n: 14, called: [0, 9, 12], doors: 1, ropeTop: 9, label: '1', dir: 0, pitch: 4, indicators: [], landingOpen: null });
  lamp(1, 3.6, 1.5, 1.6, 5); lamp(1, 3.6, -4, 1.0);
  cam.position.set(0.55, 1 + 1.62, 2.65); cam.lookAt(1.9, 1.95, 0.4);
  cam.fov = 80; cam.updateProjectionMatrix();
} else if (SHOT === 'panel' || SHOT === 'button') {
  lobby(0, { open: SHOT === 'panel' });
  shaftWalls(1, 4);
  car({ w: 2, d: 3, car: 1, n: 14, called: [0, 6, 11], doors: SHOT === 'panel' ? 1 : 0, ropeTop: 9, label: '7', dir: 1, pitch: 4, indicators: [1], landingOpen: null });
  lamp(1, 3.6, 1.5, 1.6, 5); lamp(1, 3.6, -4, 1.0);
  if (SHOT === 'panel') { cam.position.set(0.9, 2.55, 1.6); cam.lookAt(1.89, 2.2, 0.45); cam.fov = 55; }
  else { cam.position.set(1.6, 2.7, -2.6); cam.lookAt(2.5, 2.4, -1.0); cam.fov = 60; }
  cam.updateProjectionMatrix();
} else if (SHOT === 'shaft') {
  // a cutaway from the side: three floors, the shaft's near side wall and the rooms left off
  for (const fy of [0, 4, 8]) {
    floorSlab(fy, -4, 1, -4, -1, false);
    for (let y = fy + 1; y <= fy + 3; y++) for (let x = -4; x <= 1; x++) if (!((x === 0 || x === 1) && y <= fy + 2)) cube(x, y, -1, { north: WALL_T, side: CORE_T, up: CORE_T, down: CORE_T });
    liftDoors(fy, fy === 4);
  }
  for (let y = 0; y <= 12; y++) { for (let x = -1; x <= 1; x++) cube(x, y, 3, CORE_T); for (let z = 0; z <= 2; z++) cube(-1, y, z, CORE_T); }
  car({ w: 2, d: 3, car: 6.4, n: 14, called: [2], doors: 0, ropeTop: 12.5, label: '2', dir: 1, pitch: 4, indicators: [1, 5, 9], landingOpen: null });
  scene.children.filter(o => o.isAmbientLight).forEach(o => o.intensity = 1.0);
  lamp(4, 7, 1.5, 2.0, 16); lamp(-2, 3.5, -3, 1.0); lamp(-2, 11.5, -3, 1.0);
  scene.fog = null;
  cam.position.set(6.2, 7.6, -3.2); cam.lookAt(0.8, 6.6, 0.8);
} else if (SHOT === 'escalator') {
  escalators();
  scene.children.filter(o => o.isAmbientLight).forEach(o => o.intensity = 2.4);
  lamp(3, 9, -3, 2.2, 24); lamp(3, 4, 4, 1.6, 14);
  cam.position.set(2.6, 1.62, 6.5); cam.lookAt(3.0, 4.0, -4);
}
// the landing's own panel of glass/glow
for (const k in buckets) {
  const b = buckets[k], t = await tex(b.path);
  if (t && t.image && t.image.height > t.image.width) FRAMES[b.path] = t.image.height / t.image.width;
}
// rebuild with frame counts known (escalator strips are 16 frames tall)
if (Object.keys(FRAMES).length && !window.__again) {
  // uv v was divided by FRAMES[name]; scale afterwards for path-keyed strips
  for (const k in buckets) { const b = buckets[k], f = FRAMES[b.path]; if (f) for (let i = 1; i < b.uv.length; i += 2) b.uv[i] /= f; }
}
for (const k in buckets) {
  const b = buckets[k], t = await tex(b.path);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(b.nrm, 3));
  const m = b.glow ? new THREE.MeshBasicMaterial({ map: t, side: THREE.DoubleSide, alphaTest: 0.1 })
    : new THREE.MeshLambertMaterial({ map: t, side: THREE.DoubleSide, alphaTest: b.alpha ? 0 : 0.1, transparent: b.alpha, opacity: 1, depthWrite: !b.alpha });
  scene.add(new THREE.Mesh(g, m));
}
renderer.render(scene, cam);
window.DONE = true;
</script></body></html>
