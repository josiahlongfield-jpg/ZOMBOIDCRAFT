<!doctype html><html><body>
<!-- Mixamo FBX files -> mix.json for pack.py. Put the clips beside this page as clip_<Name>.fbx (spaces as _), the first
     (Breathing_Idle) downloaded With Skin, link three's node_modules here, and run: node run.js export.html mix.json text
     (other clips: node run.js "export.html?clips=Breathing_Idle,Female_Walk,..." mix.json text). An upload in centimetres
     comes out in metres like the rest. --><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
const log=[]; window.LOG=log;
const b64=a=>{ const u=new Uint8Array(a.buffer,a.byteOffset,a.byteLength); let s=''; for(let i=0;i<u.length;i+=32768) s+=String.fromCharCode.apply(null,u.subarray(i,i+32768)); return btoa(s); };
try{
const load=async f=>new FBXLoader().parse(await (await fetch(f)).arrayBuffer(),'./none/');
const root=await load('clip_Breathing_Idle.fbx'); root.updateMatrixWorld(true);
const box=new THREE.Box3().setFromObject(root); const U=box.max.y-box.min.y>10?0.01:1;  // a character taller than 10 units was uploaded in cm
const bones=[],idx={}; root.traverse(o=>{ if(o.isBone && !(o.name in idx)){ idx[o.name]=bones.length; bones.push(o);} });
const parent=bones.map(b=>b.parent&&b.parent.isBone?idx[b.parent.name]:-1);
const inv=new Array(bones.length).fill(null); const meshes=[];
root.traverse(o=>{ if(!o.isSkinnedMesh) return;
  let g=o.geometry.clone(); for(const k of Object.keys(g.attributes)) if(!['position','uv','skinIndex','skinWeight'].includes(k)) g.deleteAttribute(k);
  g.clearGroups(); g=mergeVertices(g,1e-6); g.computeVertexNormals();
  const n=g.attributes.position.count, P=new Float32Array(n*3), N=new Float32Array(n*3), v=new THREE.Vector3(), nm=new THREE.Matrix3().getNormalMatrix(o.bindMatrix);
  for(let i=0;i<n;i++){ v.fromBufferAttribute(g.attributes.position,i).applyMatrix4(o.bindMatrix).multiplyScalar(U); P.set([v.x,v.y,v.z],i*3); v.fromBufferAttribute(g.attributes.normal,i).applyMatrix3(nm).normalize(); N.set([v.x,v.y,v.z],i*3); }
  const map=o.skeleton.bones.map(b=>idx[b.name]); const SI=new Uint8Array(n*4), SW=new Float32Array(n*4);
  for(let i=0;i<n;i++) for(let k=0;k<4;k++){ SI[i*4+k]=map[g.attributes.skinIndex.array[i*4+k]]; SW[i*4+k]=g.attributes.skinWeight.array[i*4+k]; }
  o.skeleton.bones.forEach((b,j)=>{ const m=o.skeleton.boneInverses[j].clone(); m.elements[12]*=U; m.elements[13]*=U; m.elements[14]*=U; if(!inv[idx[b.name]]) inv[idx[b.name]]=m.toArray(); });
  meshes.push({name:o.name,n,pos:b64(P),normal:b64(N),uv:b64(new Float32Array(g.attributes.uv.array)),si:b64(SI),sw:b64(SW),ix:b64(new Uint32Array(g.index.array))});
});
// inverse binds here are model space (the bound mesh, positions above) -> bone, so skin = boneWorld * inv
const clips={};
for(const f of (new URLSearchParams(location.search).get('clips')||'Breathing_Idle,Female_Walk,Running,Dying,Aiming_Gun,Firing_Rifle,Walk_With_Rifle,Rifle_Aiming_Idle').split(',')){
  const r=await load('clip_'+f+'.fbx'); r.updateMatrixWorld(true); const clip=r.animations[0]; const mixer=new THREE.AnimationMixer(r); mixer.clipAction(clip).play();
  const rb=bones.map(b=>r.getObjectByName(b.name)); const fps=30, frames=Math.max(2,Math.round(clip.duration*fps)+1); const out=new Float32Array(frames*bones.length*7);
  const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3(); let smax=0;
  for(let fr=0;fr<frames;fr++){ mixer.setTime(Math.min(fr/fps,clip.duration)); r.updateMatrixWorld(true);
    rb.forEach((b,j)=>{ b.matrixWorld.decompose(p,q,s); smax=Math.max(smax,Math.abs(s.x-1),Math.abs(s.y-1),Math.abs(s.z-1)); out.set([p.x*U,p.y*U,p.z*U,q.x,q.y,q.z,q.w],(fr*bones.length+j)*7); }); }
  clips[f]={frames,fps,data:b64(out)}; log.push(f+' frames '+frames+' scaleDev '+smax.toFixed(4));
}
window.OUT=JSON.stringify({bones:bones.map(b=>b.name),parent,inv,meshes,clips});
log.push('bones '+bones.length+' meshes '+meshes.map(m=>m.name+':'+m.n).join(' '));
}catch(e){log.push('ERR '+e.stack)}
window.DONE=1;
</script></body></html>
