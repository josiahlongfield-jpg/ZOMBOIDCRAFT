name: Zombie shots

# Frames of the zombie behaviour previews in a real client (ZombieLoreTest, ZombieHerdTest, ZombieDeadTest: set the test in the "Only the zombie test" step), pushed to the shots/w8d2gc branch
# for the zombie behaviour thread to stitch into clips.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-w8d2gc]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xserver-xorg-core xserver-xorg-video-dummy mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers > /dev/null
      # only this test
      - name: Only the zombie test
        run: |
          sed -i 's/"fabric-client-gametest": \[[^]]*\]/"fabric-client-gametest": ["com.zomboidcraft.client.zombie.ZombieDeadTest"]/' src/gametest/resources/fabric.mod.json
      - name: Shrink block textures for the software renderer
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          root = 'src/main/resources/assets/zomboidcraft/textures'
          for d, _, fs in os.walk(root):
              for f in fs:
                  p = os.path.join(d, f)
                  if f.endswith(('_n.png', '_s.png')):
                      os.remove(p); continue
                  if f.endswith('.png'):
                      im = Image.open(p)
                      if im.width > 256 and im.width == im.height:
                          im.resize((256, 256), Image.LANCZOS).save(p)
          PY
      - name: Run client test
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -Puitest 2>&1 | tee test.log | grep -E "ZCLORE|ZCHERD|ZCDEAD|error:|ERROR|Exception|FAIL|BUILD|Caused" | head -150 || true
      - name: Push the screenshots
        if: always()
        run: |
          mkdir -p /tmp/shots
          find . -path '*screenshots*' -name '*.png' -exec cp {} /tmp/shots/ \; || true
          grep -E "ZCLORE|ZCHERD|ZCDEAD|Exception|Caused" test.log | head -100 > /tmp/shots/log.txt || true
          cd /tmp/shots
          git init -q && git checkout -q -b shots/w8d2gc
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "zombie shots ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots/w8d2gc
