name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: Minecraft version
        default: '26.3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MC_VERSION: ${{ github.event.inputs.minecraft_version || '26.3' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve latest Fabric versions
        id: versions
        run: |
          set -euo pipefail
          loader=$(curl -sf https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          loom=$(curl -sf https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml \
            | grep -oP '(?<=<version>)[^<]+' | grep -v -- '-SNAPSHOT' | tail -1)
          api=$(curl -sfG https://api.modrinth.com/v2/project/fabric-api/version \
            --data-urlencode "game_versions=[\"$MC_VERSION\"]" --data-urlencode 'loaders=["fabric"]' \
            | jq -r '.[0].version_number')
          echo "Minecraft $MC_VERSION | loader $loader | loom $loom | fabric-api $api"
          {
            echo "loader=$loader"
            echo "loom=$loom"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build \
            -Pminecraft_version=$MC_VERSION \
            -Ploader_version=${{ steps.versions.outputs.loader }} \
            -Ploom_version=${{ steps.versions.outputs.loom }} \
            -Pfabric_api_version=${{ steps.versions.outputs.api }} 2>&1 | tee build.log

      # When the build fails, print the real class layout and signatures.
      - name: Probe Minecraft classes
        if: failure()
        run: .github/probe.sh

      # Boot a dedicated server with the mod to prove it loads and the mixins apply.
      - name: Server smoke test
        run: |
          mkdir -p run && echo 'eula=true' > run/eula.txt
          trap 'echo "----- server.log tail"; tail -n 120 server.log' EXIT
          mkfifo console
          ./gradlew runServer --args=nogui < console > server.log 2>&1 &
          pid=$!
          exec 3> console
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then echo "Server started"; break; fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
            sleep 5
          done
          # Load zombies so their mixins, goals and attachments run, then let them tick.
          echo 'summon minecraft:zombie 0 100 0' >&3
          echo 'summon minecraft:husk 2 100 0' >&3
          echo 'summon minecraft:zombie_villager 4 100 0' >&3
          echo 'zc config' >&3
          echo 'zc weather severe_storm' >&3
          echo 'zc weather' >&3
          # A shop shelf gets its loot table, and every shop table loads and rolls.
          echo 'forceload add 0 0' >&3
          echo 'setblock 0 100 0 zomboidcraft:store_shelf_grocery' >&3
          echo 'data get block 0 100 0' >&3
          for t in $(ls src/main/resources/data/zomboidcraft/loot_table/shop | sed 's/.json//'); do
            echo "loot spawn 0 101 0 loot zomboidcraft:shop/$t" >&3
          done
          for t in $(ls src/main/resources/data/zomboidcraft/loot_table/car | sed 's/.json//'); do
            echo "loot spawn 0 101 0 loot zomboidcraft:car/$t" >&3
          done
          # A car prop loads its model index, saves and reloads its state.
          echo 'summon zomboidcraft:car 0 101 0 {model:"swat_van",variant:"wrecked"}' >&3
          sleep 3  # let the force-loaded chunk start ticking so the selector can see the car
          echo 'data get entity @e[type=zomboidcraft:car,limit=1] model' >&3
          sleep 10
          echo 'stop' >&3
          for i in $(seq 1 12); do kill -0 $pid 2>/dev/null || break; sleep 5; done
          exec 3>&-
          kill $pid 2>/dev/null || true
          pkill -f 'net.fabricmc' || true
          grep -E 'zomboidcraft|The dead walk|Summoned|Mixin|ERROR|Exception|settings|Dropped|LootTable|loot' server.log | head -90 || true
          grep -q 'zomboidcraft:shop/grocery' server.log
          grep -q 'swat_van' server.log
          [ "$(grep -c 'Dropped' server.log)" -ge 16 ]
          grep -q 'The dead walk' server.log && grep -q 'Done (' server.log && grep -q 'Summoned' server.log
          ! grep -E 'Mixin apply failed|InvalidMixin|Exception in server tick|Encountered an unexpected exception|crash report|zomboidcraft.*Exception' server.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zomboidcraft-jar
          path: build/libs/*.jar

      - name: Publish latest build
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/zomboidcraft-*.jar \
            --prerelease --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7} for Minecraft $MC_VERSION. Needs Fabric Loader and Fabric API."
