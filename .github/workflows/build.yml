name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: Minecraft version
        default: '26.3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Playtest builds take turns: two publishes at once delete each other's tag, which hides the jar.
    concurrency:
      group: ${{ github.ref == 'refs/heads/playtest' && 'playtest-publish' || format('build-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      MC_VERSION: ${{ github.event.inputs.minecraft_version || '26.3' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve latest Fabric versions
        id: versions
        run: |
          set -euo pipefail
          loader=$(curl -sf https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          loom=$(curl -sf https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml \
            | grep -oP '(?<=<version>)[^<]+' | grep -v -- '-SNAPSHOT' | tail -1)
          api=$(curl -sfG https://api.modrinth.com/v2/project/fabric-api/version \
            --data-urlencode "game_versions=[\"$MC_VERSION\"]" --data-urlencode 'loaders=["fabric"]' \
            | jq -r '.[0].version_number')
          echo "Minecraft $MC_VERSION | loader $loader | loom $loom | fabric-api $api"
          {
            echo "loader=$loader"
            echo "loom=$loom"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v5

      # Stamp the commit on the version (0.5.2+abc1234), so the mod list shows which build is installed.
      - name: Stamp build version
        run: echo "ORG_GRADLE_PROJECT_mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build \
            -Pminecraft_version=$MC_VERSION \
            -Ploader_version=${{ steps.versions.outputs.loader }} \
            -Ploom_version=${{ steps.versions.outputs.loom }} \
            -Pfabric_api_version=${{ steps.versions.outputs.api }} 2>&1 | tee build.log

      # When the build fails, print the real class layout and signatures.
      - name: Probe Minecraft classes
        if: failure()
        run: .github/probe.sh

      # Boot a dedicated server with the mod to prove it loads and the mixins apply.
      - name: Server smoke test
        run: |
          mkdir -p run && echo 'eula=true' > run/eula.txt
          trap 'echo "----- server.log tail"; tail -n 120 server.log' EXIT
          mkfifo console
          ./gradlew runServer --args=nogui < console > server.log 2>&1 &
          pid=$!
          exec 3> console
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then echo "Server started"; break; fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
            sleep 5
          done
          # Load zombies so their mixins, goals and attachments run, then let them tick.
          echo 'summon minecraft:zombie 0 100 0' >&3
          echo 'summon minecraft:husk 2 100 0' >&3
          echo 'summon minecraft:zombie_villager 4 100 0' >&3
          echo 'zc config' >&3
          echo 'zc weather severe_storm' >&3
          echo 'zc weather' >&3
          # A shop shelf gets its loot table, and every shop table loads and rolls.
          echo 'forceload add 0 0' >&3
          echo 'setblock 0 100 0 zomboidcraft:store_shelf_grocery' >&3
          echo 'data get block 0 100 0' >&3
          for t in $(ls src/main/resources/data/zomboidcraft/loot_table/shop | sed 's/.json//'); do
            echo "loot spawn 0 101 0 loot zomboidcraft:shop/$t" >&3
          done
          for t in $(ls src/main/resources/data/zomboidcraft/loot_table/car | sed 's/.json//'); do
            echo "loot spawn 0 101 0 loot zomboidcraft:car/$t" >&3
          done
          # A car prop loads its model index, saves and reloads its state.
          echo 'summon zomboidcraft:car 0 101 0 {model:"swat_van",variant:"wrecked"}' >&3
          sleep 6  # let the force-loaded chunk start ticking so the selector can see the car
          echo 'data get entity @e[type=zomboidcraft:car,limit=1] model' >&3
          echo 'data get entity @e[type=minecraft:husk,limit=1] Health' >&3
          echo 'execute as @e[type=zomboidcraft:car] run say car here' >&3
          # A walker that dies falls, then leaves its body (no puff), which saves with the world.
          # (the test zombies hover: dropped from y 101 they'd die of the fall before the commands reach them)
          echo 'summon minecraft:zombie 6 101 6 {Tags:["zc_dead"],NoGravity:1b}' >&3
          sleep 2
          echo 'kill @e[tag=zc_dead]' >&3
          sleep 4
          echo 'execute as @e[type=zomboidcraft:corpse] run say corpse here' >&3
          echo 'data get entity @e[type=zomboidcraft:corpse,limit=1] outfit' >&3
          # Only the head kills: a bullet anywhere else leaves a walker alive however hard it hits.
          echo 'summon minecraft:zombie 8 101 8 {Tags:["zc_tough"],NoGravity:1b}' >&3
          sleep 2
          echo 'damage @e[tag=zc_tough,limit=1] 500 zomboidcraft:bullet' >&3
          sleep 1
          echo 'execute as @e[tag=zc_tough] run say still alive after a body shot' >&3
          # A test train line gets laid and its train runs round it.
          echo 'execute positioned 0 100 0 run zc train test rail' >&3
          # A test lift is built and called to its top floor.
          echo 'forceload add 40 40' >&3
          echo 'execute positioned 40 100 40 run zc lift test 4' >&3
          sleep 8
          echo 'zc train list' >&3
          echo 'zc lift list' >&3
          echo 'zc lift call' >&3
          sleep 12
          echo 'zc lift list' >&3
          sleep 20  # (12 s went on the lift above) it comes in to its platform about 30 s after the loop is laid (slower on a busy server), then stands there 34 s
          echo 'zc train list' >&3
          sleep 2
          echo 'stop' >&3
          for i in $(seq 1 12); do kill -0 $pid 2>/dev/null || break; sleep 5; done
          exec 3>&-
          kill $pid 2>/dev/null || true
          pkill -f 'net.fabricmc' || true
          grep -E 'lift|Called' server.log | head -20 || true
          grep -E 'zomboidcraft|test_rail|The dead walk|Summoned|Mixin|ERROR|Exception|settings|Dropped|LootTable|loot' server.log | head -90 || true
          grep -q 'zomboidcraft:shop/grocery' server.log
          grep -q 'swat_van' server.log
          grep -q 'corpse here' server.log
          grep -q 'still alive after a body shot' server.log
          grep -q 'Laid test line test_rail' server.log && grep -E 'test_rail \(rail.*train 0 at' server.log && grep -E 'test_rail \(rail.*\(stopped\)' server.log
          [ "$(grep -c 'Dropped' server.log)" -ge 16 ]
          grep -q 'The dead walk' server.log && grep -q 'Done (' server.log && grep -q 'Summoned' server.log
          grep -E 'Rain (cover|falls through)' server.log
          grep -q 'Rain cover:' server.log
          ! grep -E 'Mixin apply failed|InvalidMixin|Exception in server tick|Encountered an unexpected exception|crash report|zomboidcraft.*Exception' server.log

      # Boot again on a fresh ZomboidCraft County world: the planner, chunk generator and every
      # kind of place get generated, and /zc places reports what's around.
      - name: County world smoke test
        run: |
          rm -rf run/world
          mkdir -p build/county
          javac -d build/county src/main/java/com/zomboidcraft/world/city/*.java src/main/java/com/zomboidcraft/world/county/*.java tools/county/ListPlaces.java
          java -cp build/county:src/main/resources ListPlaces 12345 6000 | tee places.all
          # only the place rows (the planner's own log lines go to the same output)
          grep -E '^[a-z_]+ [a-z_]+ -?[0-9]+ -?[0-9]+( |$)' places.all > places.txt
          # and the railway: the el and subway at Union Station, a country stop, the el's bridge over the north arm
          printf 'rail union_el 3043 -1150\nrail union_subway 3050 -1043\nrail millbrook -4750 -1003\nrail north_arm_bridge 3010 -2420\n' >> places.txt
          # forceload makes the server thread wait while each place is built (several at once queue behind one
          # build lock), which in play happens off the main thread; give the watchdog room so a slow runner passes
          printf 'level-type=zomboidcraft\\:county\nlevel-seed=12345\nmax-tick-time=300000\n' >> run/server.properties
          grep level- run/server.properties
          trap 'echo "----- county server.log"; grep -E "orce|WARN|ERROR|Exception|Done|county|County lines|Can.t keep up" county.log | grep -v "^[[:space:]]" | head -n 150; for f in run/crash-reports/*.txt; do [ -f "$f" ] && { echo "----- $f"; head -n 30 "$f"; echo "----- threads"; grep "^\"" "$f"; echo "----- busy threads"; awk -v RS= "/zomboidcraft|Worker-Main|Server thread/" "$f" | head -n 400; }; done' EXIT
          rm -f console2 && mkfifo console2
          ./gradlew runServer --args=nogui < console2 > county.log 2>&1 &
          pid=$!
          exec 4> console2
          for i in $(seq 1 120); do
            if grep -q 'Done (' county.log; then echo "Server started"; break; fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
            sleep 5
          done
          echo 'zc places' >&4
          for t in downtown town suburb farm port military roadside; do
            echo "zc places $t" >&4
          done
          sleep 3
          # generate chunks in the middle of the nearest place of each kind and variant
          while read -r type variant cx cz rest; do
            echo "forceload add $((cx - 20)) $((cz - 20)) $((cx + 20)) $((cz + 20))" >&4
            sleep 2
          done < places.txt
          echo 'forceload add -100 -100 100 100' >&4
          sleep 90
          echo 'zc lift list' >&4
          sleep 1
          echo 'stop' >&4
          for i in $(seq 1 24); do kill -0 $pid 2>/dev/null || break; sleep 5; done
          exec 4>&-
          kill $pid 2>/dev/null || true
          pkill -f 'net.fabricmc' || true
          grep -E 'county|blocks (north|south|east|west)|ERROR|Exception' county.log | head -80 || true
          grep -E 'lifts running|lift at' county.log | head -20 || true
          grep 'Unknown vanilla block' county.log | sort -u | head -40 || true
          ! grep -q 'Unknown vanilla block' county.log
          grep -q 'ZomboidCraft county planned' county.log
          grep 'County lines laid for the trains' county.log
          grep -q 'Done (' county.log
          ! grep -E 'Exception in server tick|Encountered an unexpected exception|crash report|zomboidcraft.*Exception|Failed to (load|parse)' county.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zomboidcraft-jar
          path: build/libs/*.jar

      - name: Publish latest build
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/zomboidcraft-*.jar \
            --prerelease --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7} for Minecraft $MC_VERSION. Needs Fabric Loader and Fabric API."

      # The playtest branch gathers every thread's work so there is one jar to try.
      - name: Publish playtest build
        if: success() && github.ref == 'refs/heads/playtest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete playtest-build --yes --cleanup-tag || true
          # a release that lost its tag lingers as a hidden draft: clear those too
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft and .name == "Playtest build") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"
          # (the tag must not share the branch name, or git refs get ambiguous)
          gh release delete playtest --yes --cleanup-tag || true
          # one fixed name, so a new download replaces the old file instead of sitting beside it
          cp build/libs/zomboidcraft-*.jar zomboidcraft-playtest.jar
          gh release create playtest-build zomboidcraft-playtest.jar \
            --prerelease --title "Playtest build" --target "$GITHUB_SHA" \
            --notes "Everything in progress, merged together, from ${GITHUB_SHA::7}. Delete any other ZomboidCraft jar (zomboidcraft-0.5.x.jar) from your mods folder. Needs Fabric Loader and Fabric API. Replace any other ZomboidCraft jar with this one."
          # the link Josiah uses must answer, or this build is not done
          sleep 10
          curl -sfIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/playtest-build/zomboidcraft-playtest.jar"
