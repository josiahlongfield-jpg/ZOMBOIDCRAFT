name: Horde bench

# Server tick time with 800 walkers, horde savings off and on (src/gametest/.../zombie/HordeBenchTest.java), once on
# its own and once with Lithium. The ZCBENCH lines are the result.

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-u0is1s]
    paths: ['.github/workflows/hordebench.yml', 'src/gametest/java/com/zomboidcraft/client/zombie/HordeBenchTest.java',
            'src/main/java/com/zomboidcraft/zombie/perf/**']

jobs:
  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lithium: ['', 'mc26.3-0.26.3-fabric']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xserver-xorg-core xserver-xorg-video-dummy mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers > /dev/null
      - name: Only the horde bench
        run: |
          sed -i 's/"fabric-client-gametest": \[[^]]*\]/"fabric-client-gametest": ["com.zomboidcraft.client.zombie.HordeBenchTest"]/' src/gametest/resources/fabric.mod.json
      - name: Shrink block textures for the software renderer
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          root = 'src/main/resources/assets/zomboidcraft/textures'
          for d, _, fs in os.walk(root):
              for f in fs:
                  p = os.path.join(d, f)
                  if f.endswith(('_n.png', '_s.png')):
                      os.remove(p); continue
                  if f.endswith('.png'):
                      im = Image.open(p)
                      if im.width > 256 and im.width == im.height:
                          im.resize((256, 256), Image.LANCZOS).save(p)
          PY
      - name: Run the bench
        run: |
          EXTRA=""
          if [ -n "${{ matrix.lithium }}" ]; then EXTRA="-Pbenchlithium=${{ matrix.lithium }}"; fi
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest -Puitest $EXTRA > test.log 2>&1 || true
          echo "Lithium: ${{ matrix.lithium || 'no' }}"
          grep -iE "ZCBENCH|lithium|error:|Exception|FAIL|BUILD|Caused" test.log | grep -v "^\s*at " | head -120 || true
