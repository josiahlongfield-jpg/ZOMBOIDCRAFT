name: Companion shots

# Films a companion looking after herself in a real client (CompanionCareTest) and pushes the frames and log to the
# shots/pd5a26 branch, for the NPC thread's video previews.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-pd5a26]
    paths: ['src/gametest/java/com/zomboidcraft/client/npc/**', '.github/workflows/companionshots.yml']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xserver-xorg-core xserver-xorg-video-dummy mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers > /dev/null
      - name: Only the companion test
        run: |
          sed -i 's/"fabric-client-gametest": \[[^]]*\]/"fabric-client-gametest": ["com.zomboidcraft.client.npc.CompanionCareTest"]/' src/gametest/resources/fabric.mod.json
      - name: Shrink block textures for the software renderer
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          root = 'src/main/resources/assets/zomboidcraft/textures'
          for d, _, fs in os.walk(root):
              for f in fs:
                  p = os.path.join(d, f)
                  if f.endswith(('_n.png', '_s.png')):
                      os.remove(p); continue
                  if f.endswith('.png'):
                      im = Image.open(p)
                      if im.width > 256 and im.width == im.height:
                          im.resize((256, 256), Image.LANCZOS).save(p)
          PY
      - name: Run client test
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -Puitest 2>&1 | tee test.log | grep -E "ZCNPC|error:|ERROR|Exception|FAIL|BUILD|Caused|\[CHAT\]" | head -200 || true
      - name: Push the frames
        if: always()
        run: |
          mkdir -p /tmp/shots
          find . -path '*screenshots*' -name '*.png' -exec cp {} /tmp/shots/ \; || true
          grep -E "ZCNPC|Exception|Caused|error:|\[CHAT\]" test.log | head -300 > /tmp/shots/log.txt || true
          cd /tmp/shots
          git init -q && git checkout -q -b shots/pd5a26
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "companion shots ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots/pd5a26
