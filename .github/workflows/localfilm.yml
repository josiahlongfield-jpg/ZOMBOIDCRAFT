name: Local gun film

# Films guns kept on this computer (src/gametest/.../combat/LocalGunFilmTest.java: stand-ins made of our own
# meshes, never Brita's) and pushes the frames and their captions to the shots/5nbhdi-local branch, for the preview.

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-5nbhdi]
    paths: ['.github/workflows/localfilm.yml', 'src/gametest/java/com/zomboidcraft/client/combat/LocalGunFilmTest.java',
            'src/main/java/com/zomboidcraft/combat/LocalGuns.java', 'src/client/java/com/zomboidcraft/client/combat/MeshGunRenderer.java',
            'src/client/java/com/zomboidcraft/client/combat/LocalGunProperty.java']

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xserver-xorg-core xserver-xorg-video-dummy mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers ffmpeg > /dev/null
      - name: Only the local gun film
        run: |
          sed -i 's/"fabric-client-gametest": \[[^]]*\]/"fabric-client-gametest": ["com.zomboidcraft.client.combat.LocalGunFilmTest"]/' src/gametest/resources/fabric.mod.json
      - name: Shrink block textures for the software renderer
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          root = 'src/main/resources/assets/zomboidcraft/textures'
          for d, _, fs in os.walk(root):
              for f in fs:
                  p = os.path.join(d, f)
                  if f.endswith(('_n.png', '_s.png')):
                      os.remove(p); continue
                  if f.endswith('.png'):
                      im = Image.open(p)
                      if im.width > 256 and im.width == im.height:
                          im.resize((256, 256), Image.LANCZOS).save(p)
          PY
      - name: Run client test
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -Puitest 2>&1 | tee test.log | grep -E "ZCLOCAL (gave|without|standin)|error:|ERROR|Exception|FAIL|BUILD|Caused" | head -200 || true
      - name: Push the frames and the video
        if: always()
        run: |
          mkdir -p /tmp/shots
          find . -path '*screenshots*' -name '*local-*.png' -exec cp {} /tmp/shots/ \; || true
          grep -E -A2 "Exception|Caused|error:" test.log | head -150 > /tmp/shots/log.txt || true
          grep "ZCLOCAL" test.log > /tmp/shots/captions.txt || true
          cd /tmp/shots
          git init -q && git checkout -q -b shots/5nbhdi-local
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "local gun film ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots/5nbhdi-local
