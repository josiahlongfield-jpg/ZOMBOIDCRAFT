name: Fetch sounds

# Collects CC0 candidate sounds from Freesound (this cloud dev machine can't reach it) and
# pushes them to the sounds-raw branch for picking. Not part of the build.
on:
  workflow_dispatch:
  push:
    branches: [sounds-fetch]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/audio/fetch_freesound.py raw
      - name: Push to sounds-raw
        run: |
          cd raw
          git init -q -b sounds-raw
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Candidate CC0 sounds from Freesound"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sounds-raw
