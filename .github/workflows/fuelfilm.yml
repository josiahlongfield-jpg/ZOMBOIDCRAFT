name: Fuel film

# Films road-car fuel at a pump (src/gametest/.../cars/FuelFilmTest.java) and pushes the frames and the joined
# video to the shots/cilddw-fuel branch, for the preview.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-cilddw]
    paths: ['.github/workflows/fuelfilm.yml', 'src/gametest/java/com/zomboidcraft/client/cars/FuelFilmTest.java',
            'src/main/java/com/zomboidcraft/world/cars/Fuel.java']

permissions:
  contents: write

jobs:
  film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xserver-xorg-core xserver-xorg-video-dummy mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers ffmpeg > /dev/null
      - name: Only the fuel film
        run: |
          sed -i 's/"fabric-client-gametest": \[[^]]*\]/"fabric-client-gametest": ["com.zomboidcraft.client.cars.FuelFilmTest"]/' src/gametest/resources/fabric.mod.json
      - name: Shrink block textures for the software renderer
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          root = 'src/main/resources/assets/zomboidcraft/textures'
          for d, _, fs in os.walk(root):
              for f in fs:
                  p = os.path.join(d, f)
                  if f.endswith(('_n.png', '_s.png')):
                      os.remove(p); continue
                  if f.endswith('.png'):
                      im = Image.open(p)
                      if im.width > 256 and im.width == im.height:
                          im.resize((256, 256), Image.LANCZOS).save(p)
          PY
      - name: Run client test
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest -Puitest 2>&1 | tee test.log | grep -E "ZCFUEL|error:|ERROR|Exception|FAIL|BUILD|Caused" | head -150 || true
      - name: Push the frames and the video
        if: always()
        run: |
          mkdir -p /tmp/shots
          find . -path '*screenshots*' -name '*fuel-*.png' -exec cp {} /tmp/shots/ \; || true
          grep -E -A2 "ZCFUEL|Exception|Caused|error:" test.log | head -150 > /tmp/shots/log.txt || true
          cd /tmp/shots
          ls *fuel-*.png > /dev/null 2>&1 && ffmpeg -loglevel error -framerate 10 -pattern_type glob -i '*fuel-*.png' -vf "scale=1280:-2" -c:v libx264 -pix_fmt yuv420p -crf 23 fuel.mp4 || true
          git init -q && git checkout -q -b shots/cilddw-fuel
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "fuel film ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots/cilddw-fuel
